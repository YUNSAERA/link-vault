/* =====================================================================
   위젯 공통 — Clean Quest · Link Vault · Home Vault · Cosmetic Vault 와 같은 디자인 토큰
   글꼴(Inter · Noto Sans KR)은 이 파일 안에 필요한 글자만 넣어둠 → 외부 폰트 · CDN 요청 없음
   ===================================================================== */
:root{
  --body:'WInter','WNotoKR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --page:#f5f6f8;--card:#ffffff;--ink:#18181b;--sub:#5c5c66;--muted:#767680;--field:#f4f4f5;--line:rgba(24,24,27,.06);
  --accent:#0f766e;--soft:rgba(15,118,110,.09);--ring:rgba(15,118,110,.22);--item:#fafafa;--hover:#ececee;
  --sm:0 1px 2px rgba(24,24,27,.03),0 4px 16px -4px rgba(24,24,27,.05);
  --shadow:0 12px 32px -12px rgba(24,24,27,.08),0 2px 6px -1px rgba(24,24,27,.04);--onacc:#ffffff;
  color-scheme:light}
:root[data-theme="dark"]{
  --page:#0b0c0e;--card:#121417;--ink:#f4f4f5;--sub:#b6b6c0;--muted:#9a9aa4;--field:#1b1e23;--line:rgba(255,255,255,.07);
  --accent:#2dd4bf;--soft:rgba(45,212,191,.11);--ring:rgba(45,212,191,.24);--item:#171a1e;--hover:#242932;
  --sm:0 1px 2px rgba(0,0,0,.35),0 8px 24px -8px rgba(0,0,0,.45);--shadow:0 16px 40px -14px rgba(0,0,0,.6),0 4px 12px -2px rgba(0,0,0,.35);--onacc:#0b1110;
  color-scheme:dark}

/* ===== 기본 ===== */
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}   /* 노션 배경이 그대로 보이게 */
body{padding:16px;display:flex;justify-content:center}
.card{width:100%;max-width:440px;padding:24px 24px 18px;background:var(--card);border-radius:28px;box-shadow:var(--shadow);word-break:keep-all;overflow-wrap:anywhere}
button{font-family:var(--body);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .16s cubic-bezier(.22,1,.36,1),background-color .2s,color .2s}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ===== 머리글 (앱과 같은 모양) ===== */
.head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.mark{width:40px;height:40px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:none}
.head-text{flex:1;min-width:0}
.head h1{font-size:19px;font-weight:700;line-height:1.25;letter-spacing:-.025em;margin:0}
.head-sub{font-size:13px;color:var(--muted);margin-top:2px}
.badge{background:var(--soft);color:var(--accent);font-weight:600;font-size:13px;min-width:38px;text-align:center;padding:6px 12px;border-radius:999px;flex:none;white-space:nowrap}
.badge:empty{display:none}

/* ===== 큰 숫자 · 진행 막대 ===== */
.big{font-size:clamp(42px,12vw,54px);font-weight:800;line-height:1;letter-spacing:-.045em;margin:2px 0 14px;display:flex;align-items:baseline;gap:4px}
.big small{font-size:.4em;font-weight:700;color:var(--accent);letter-spacing:0}
.bar{height:8px;border-radius:999px;background:var(--field);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:inherit;background:var(--accent);transition:width .6s ease}

/* ===== 작은 숫자 칸 ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-top:14px}
.stat{background:var(--field);border-radius:16px;padding:10px 13px 11px}
.stat span{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}
.stat b{display:block;font-size:18px;font-weight:700;letter-spacing:-.02em;margin-top:1px;white-space:nowrap}

/* ===== 푸터 (앱과 같은 모양) ===== */
.foot{display:flex;align-items:center;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.lab{flex:1;min-width:0;font-size:12px;letter-spacing:.08em;font-weight:600;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab i{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 3px var(--soft)}
.fb{width:36px;height:36px;border-radius:999px;border:0;background:var(--field);color:var(--sub);font-size:14px;display:grid;place-items:center;flex:none;padding:0}
.fb:hover{background:var(--hover);color:var(--ink)}

@media (max-width:380px){body{padding:10px}.card{padding:20px 16px 16px;border-radius:24px}.head{gap:12px;margin-bottom:14px}.stat b{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ───── 탭 (Home Vault 탭과 같은 모양) ───── */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;background:var(--field);border-radius:14px;margin:0 0 16px}
.tab{border:0;background:transparent;color:var(--sub);font-weight:600;font-size:13.5px;letter-spacing:-.01em;line-height:1.2;padding:8px 2px;min-height:36px;border-radius:11px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:var(--sm)}
/* 화면 4개를 같은 칸에 겹쳐 둠 → 탭을 바꿔도 카드 높이가 그대로 (노션 임베드 높이는 한 번만 맞추면 됨) */
.views{display:grid}
.views>.view{grid-area:1/1;min-width:0;align-self:center}   /* 짧은 화면은 가운데로 */
.views>.view:not(.on){visibility:hidden;pointer-events:none}

/* ───── 한눈에 ───── */
.mclock{display:flex;align-items:baseline;font-size:clamp(40px,12vw,50px);font-weight:800;letter-spacing:-.04em;line-height:1;margin:0 0 18px}
.mclock small{font-size:.42em;font-weight:700;color:var(--accent);letter-spacing:0;margin-left:4px}
.blk+.blk{margin-top:16px}
.rowx{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.rowx>span{font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowx>span em{font-style:normal;font-weight:500;color:var(--muted)}
.rowx>b{font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.rowx>b small{font-size:.72em;color:var(--accent);margin-left:1px}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5}

/* ───── 요일 줄 (앱 탭 모양) ───── */
.days{list-style:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:5px;margin:14px 0 0;background:var(--field);border-radius:16px}
.days li{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;border-radius:12px;color:var(--sub)}
.days li span{font-size:12px;font-weight:600;color:var(--muted)}
.days li b{font-size:15px;font-weight:700;letter-spacing:-.02em}
.days li.past{opacity:.45}
.days li.today{background:var(--card);color:var(--ink);box-shadow:var(--sm)}
.days li.today span{color:var(--accent)}
.days.sm{margin-top:9px;padding:3px;gap:2px;border-radius:12px}
.days.sm li{flex-direction:row;justify-content:center;gap:3px;padding:5px 0;border-radius:9px}
.days.sm li span{font-size:11px}.days.sm li b{font-size:12.5px}

/* ───── 시계 ───── */
.digits{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 16px}
.pair{display:flex;gap:6px;flex:1;justify-content:center}
.tile{flex:1;max-width:62px;aspect-ratio:4/5;display:grid;place-items:center;border-radius:16px;background:var(--field);color:var(--ink);font-size:min(46px,10.5vw);font-weight:700;letter-spacing:-.03em;line-height:1}
.pair.sec .tile{color:var(--accent);background:var(--soft)}
.tile.flip{animation:flip .4s cubic-bezier(.22,1,.36,1)}
@keyframes flip{0%{transform:perspective(320px) rotateX(0)}45%{transform:perspective(320px) rotateX(-65deg);opacity:.6}100%{transform:perspective(320px) rotateX(0);opacity:1}}
.sep{display:flex;flex-direction:column;gap:10px;flex:none}
.sep i{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.75}
.bar.thin{height:6px}

@media (max-width:380px){.days{gap:2px;padding:4px}.days li b{font-size:14px}.days.sm li span{display:none}.tab{font-size:13px}}
/* 노션에서 넓게 붙이면: 한눈에 = 세 칸 나란히 */
@media (min-width:720px){
  .card{max-width:980px}
  .v-all{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:28px;align-items:start}
  .v-all .blk+.blk{margin-top:0}
  .v-all .mclock{margin:22px 0 0;font-size:52px}
  .tabs{max-width:420px}
}
</style>
<script>
/* 위젯 공통 — 외부 의존성 없음
   주소 옵션: ?theme=dark | light | auto · ?utc=9 (시간대, 기본 한국 Asia/Seoul = +9, 서머타임 없음) · ?h24=1 (시계 24시간제)
   테마를 안 정하면 네 앱에서 고른 테마(⚙ 테마 전환)를 따라감 */
(function(){
  var q=new URLSearchParams(location.search);
  function store(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}   /* 노션 안에서 막혀도 괜찮게 */
  var th=q.get("theme")||(store("vault:ui")||{}).theme||"light";
  if(th==="auto")th=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  if(th==="dark")document.documentElement.setAttribute("data-theme","dark");
  var off=Number(q.get("utc"));if(q.get("utc")===null||q.get("utc")===""||!isFinite(off))off=9;
  var W={
    q:q,DAY:864e5,dow:"일월화수목금토",
    /* 지금 시각을 '그 시간대의 벽시계'로 — getUTC* 로 읽기 */
    now:function(){return new Date(Date.now()+off*36e5)},
    pad:function(n){return String(n).padStart(2,"0")},
    gmt:function(){return "GMT"+(off>=0?"+":"-")+Math.abs(off)},
    md:function(d){return (d.getUTCMonth()+1)+"월 "+d.getUTCDate()+"일"},
    hm:function(d){var h=d.getUTCHours();return (h<12?"오전":"오후")+" "+(h%12||12)+":"+W.pad(d.getUTCMinutes())},
    tick:function(fn,ms){fn();return setInterval(fn,ms||1000)},
    set:function(id,v){var e=document.getElementById(id);if(e&&e.textContent!==String(v))e.textContent=v},
    copy:function(text,btn){
      var old=btn&&btn.textContent;
      function done(){if(!btn)return;btn.textContent="✓";setTimeout(function(){btn.textContent=old},1200)}
      function fallback(){var t=document.createElement("textarea");t.value=text;t.setAttribute("readonly","");t.style.cssText="position:fixed;top:0;left:0;opacity:0";
        document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch(e){}t.remove();done()}
      /* 노션 안(iframe)에서는 클립보드 권한이 막힐 수 있어서 실패하면 예전 방식으로 */
      try{if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(done,fallback);else fallback()}catch(e){fallback()}
    }
  };
  window.W=W;
  document.addEventListener("DOMContentLoaded",function(){
    document.querySelectorAll("[data-copy-self]").forEach(function(b){
      b.title="이 위젯 주소 복사";
      b.addEventListener("click",function(){W.copy(location.origin+location.pathname,b)});
    });
  });
})();
</script>
</head>
<body>
<main class="card" aria-label="시간">
  <header class="head">
    <div class="mark" aria-hidden="true">🕰️</div>
    <div class="head-text"><h1>시간</h1><div class="head-sub" id="date"></div></div>
    <span class="badge num" id="badge"></span>
  </header>
  <div class="tabs" role="tablist" aria-label="보기">
    <button class="tab on" type="button" role="tab" data-v="all">한눈에</button>
    <button class="tab" type="button" role="tab" data-v="clock">시계</button>
    <button class="tab" type="button" role="tab" data-v="week">주간</button>
    <button class="tab" type="button" role="tab" data-v="year">연간</button>
  </div>
  <div class="views">
    <!-- 한눈에: 지금 시각 · 이번 주 · 올해 -->
    <section class="view v-all on" data-v="all" role="tabpanel">
      <div class="blk"><div class="mclock num"><span id="aHM">00:00</span><small id="aS">:00</small></div></div>
      <div class="blk">
        <div class="rowx"><span>이번 주 <em id="aWr"></em></span><b class="num"><span id="aWp">0.0</span><small>%</small></b></div>
        <div class="bar" aria-hidden="true"><i id="aWb"></i></div>
        <ol class="days sm" id="aDays"></ol>
      </div>
      <div class="blk">
        <div class="rowx"><span id="aY">올해</span><b class="num"><span id="aYp">0.0000</span><small>%</small></b></div>
        <div class="bar" aria-hidden="true"><i id="aYb"></i></div>
        <div class="hint" id="aYm"></div>
      </div>
    </section>
    <!-- 시계 -->
    <section class="view v-clock" data-v="clock" role="tabpanel" aria-hidden="true">
      <div class="digits num" id="digits" aria-hidden="true"></div>
      <div class="bar thin" aria-hidden="true"><i id="sec"></i></div>
    </section>
    <!-- 주간 -->
    <section class="view" data-v="week" role="tabpanel" aria-hidden="true">
      <p class="big num"><span id="wPct">0.0</span><small>%</small></p>
      <div class="bar" aria-hidden="true"><i id="wBar"></i></div>
      <ol class="days" id="wDays"></ol>
      <div class="hint" id="wHint"></div>
    </section>
    <!-- 연간 -->
    <section class="view" data-v="year" role="tabpanel" aria-hidden="true">
      <p class="big num"><span id="yPct">0.0000</span><small>%</small></p>
      <div class="bar" aria-hidden="true"><i id="yBar"></i></div>
      <div class="stats">
        <div class="stat"><span>오늘</span><b class="num" id="yDay">–</b></div>
        <div class="stat"><span>남은 날</span><b class="num" id="yLeft">–</b></div>
        <div class="stat"><span>주차</span><b class="num" id="yWeek">–</b></div>
      </div>
    </section>
  </div>
  <p id="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0"></p>
  <footer class="foot">
    <span class="lab"><i></i><span id="tz">실시간</span></span>
    <button class="fb" type="button" data-copy-self aria-label="이 위젯 주소 복사">🔗</button>
  </footer>
</main>
<script>
/* 시간 위젯 하나에 한눈에 · 시계 · 주간 · 연간 — 고른 탭은 기억 (주소에 ?tab=week 처럼 정해도 됨) */
var h24=W.q.get("h24")==="1",VIEWS=["all","clock","week","year"],cur="all";
try{var saved=localStorage.getItem("vault:timetab");if(VIEWS.indexOf(saved)>=0)cur=saved}catch(e){}
if(VIEWS.indexOf(W.q.get("tab"))>=0)cur=W.q.get("tab");
function show(v,keep){
  cur=v;
  document.querySelectorAll(".tab").forEach(function(t){var on=t.dataset.v===v;t.classList.toggle("on",on);t.setAttribute("aria-selected",on?"true":"false")});
  document.querySelectorAll(".view").forEach(function(s){var on=s.dataset.v===v;s.classList.toggle("on",on);s.setAttribute("aria-hidden",on?"false":"true")});
  if(keep)try{localStorage.setItem("vault:timetab",v)}catch(e){}
  render();
}
document.querySelectorAll(".tab").forEach(function(t){t.addEventListener("click",function(){show(t.dataset.v,true)})});

/* 요일 줄 두 벌 (한눈에 · 주간) — 일요일 시작 */
function dayRow(id){var ol=document.getElementById(id),L=[];for(var i=0;i<7;i++){var li=document.createElement("li");li.innerHTML="<span>"+W.dow[i]+"</span><b class=\"num\"></b>";ol.appendChild(li);L.push(li)}return L}
var aDays=dayRow("aDays"),wDays=dayRow("wDays");
/* 시계 칸 */
var tiles=[],first=true,box=document.getElementById("digits");
function pair(cls){var p=document.createElement("div");p.className="pair"+(cls?" "+cls:"");for(var i=0;i<2;i++){var t=document.createElement("span");t.className="tile";t.textContent="0";tiles.push(t);p.appendChild(t)}return p}
function sep(){var s=document.createElement("div");s.className="sep";s.innerHTML="<i></i><i></i>";return s}
box.append(pair(),sep(),pair(),sep(),pair("sec"));
W.set("tz","실시간 · "+W.gmt());

function render(){
  var d=W.now(),H=d.getUTCHours(),m=d.getUTCMinutes(),s=d.getUTCSeconds(),ampm=H<12?"오전":"오후",h=h24?H:(H%12||12);
  var y=d.getUTCFullYear(),dow=d.getUTCDay(),dayStart=Date.UTC(y,d.getUTCMonth(),d.getUTCDate()),weekStart=dayStart-dow*W.DAY;
  var y0=Date.UTC(y,0,1),y1=Date.UTC(y+1,0,1),total=(y1-y0)/W.DAY,doy=Math.floor((dayStart-y0)/W.DAY)+1,week=Math.ceil((doy+new Date(y0).getUTCDay())/7);
  var wp=(d.getTime()-weekStart)/(7*W.DAY)*100,yp=(d.getTime()-y0)/(y1-y0)*100;
  var a=new Date(weekStart),b=new Date(weekStart+6*W.DAY),range=W.md(a)+" – "+W.md(b);
  W.set("date",W.md(d)+" "+W.dow[dow]+"요일");
  W.set("badge",cur==="week"?week+"주차":cur==="year"?"D-"+(total-doy):(h24?"":ampm));
  /* 한눈에 */
  if(cur==="all"){
    W.set("aHM",W.pad(h)+":"+W.pad(m));W.set("aS",":"+W.pad(s));
    W.set("aWr",range);W.set("aWp",wp.toFixed(1));document.getElementById("aWb").style.width=wp+"%";
    W.set("aY",y+"년");W.set("aYp",yp.toFixed(4));document.getElementById("aYb").style.width=yp+"%";
    W.set("aYm",doy+"번째 날 · 남은 "+(total-doy)+"일 · "+week+"주차");
  }
  /* 시계 */
  if(cur==="clock"){
    var str=W.pad(h)+W.pad(m)+W.pad(s);
    for(var i=0;i<6;i++)if(tiles[i].textContent!==str[i]){tiles[i].textContent=str[i];if(!first&&i<4){tiles[i].classList.remove("flip");void tiles[i].offsetWidth;tiles[i].classList.add("flip")}}
    first=false;document.getElementById("sec").style.width=((s+d.getUTCMilliseconds()/1000)/60*100)+"%";
  }else first=true;
  /* 주간 */
  if(cur==="week"){
    W.set("wPct",wp.toFixed(1));document.getElementById("wBar").style.width=wp+"%";
    W.set("wHint",range+" · 지난 "+dow+"일 · 남은 "+(7-dow)+"일 (오늘 포함)");
  }
  [aDays,wDays].forEach(function(L){L.forEach(function(li,i){
    li.querySelector("b").textContent=new Date(weekStart+i*W.DAY).getUTCDate();
    li.className=i<dow?"past":i===dow?"today":"";
    if(i===dow)li.setAttribute("aria-current","date");else li.removeAttribute("aria-current")})});
  /* 연간 */
  if(cur==="year"){
    W.set("yPct",yp.toFixed(4));document.getElementById("yBar").style.width=yp+"%";
    W.set("yDay",doy+"/"+total);W.set("yLeft",(total-doy)+"일");W.set("yWeek",week+"주");
  }
  W.set("sr",W.md(d)+" "+(h24?"":ampm+" ")+h+"시 "+m+"분");
}
show(cur,false);
setInterval(render,250);
</script>
</body>
</html>
