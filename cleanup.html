<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Clean Quest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- [신규] 홈 화면에 앱처럼 추가 -->
<link rel="manifest" href="cleanup-manifest.json">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clean Quest">
<link rel="apple-touch-icon" href="cleanup-icon-192.png">
<link rel="icon" href="cleanup-icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jua&family=Noto+Sans+KR:wght@400;500;600;700&family=Gowun+Dodum&display=swap">
<style>
/* ==========================================================================
   Design Tokens (2026 Minimal Surface + Neutral Slate + Single Accent)
   ========================================================================== */
:root{
  --body:'Inter','Noto Sans KR','Gowun Dodum',sans-serif;
  --title:'Inter','Noto Sans KR','Gowun Dodum',sans-serif;
  --page:#f5f6f8;
  --card:#ffffff;
  --ink:#18181b;
  --sub:#5c5c66;
  --muted:#767680;
  --field:#f4f4f5;
  --line:rgba(24,24,27,0.06);
  --accent:#0f766e;
  --accent-soft:rgba(15,118,110,0.09);
  --accent-border:rgba(15,118,110,0.22);
  --item:#fafafa;
  --chip:#f4f4f5;
  --shadow-sm:0 1px 2px rgba(24,24,27,0.03),0 4px 16px -4px rgba(24,24,27,0.05);
  --shadow-md:0 12px 32px -12px rgba(24,24,27,0.08),0 2px 6px -1px rgba(24,24,27,0.04);
  --sky1:#eef2f6;
  --sky2:#fafaf9;
  --fill1:#0f766e;
  --fill2:#14b8a6;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0b0c0e;
    --card:#121417;
    --ink:#f4f4f5;
    --sub:#b6b6c0;
    --muted:#9a9aa4;
    --field:#1b1e23;
    --line:rgba(255,255,255,0.07);
    --accent:#2dd4bf;
    --accent-soft:rgba(45,212,191,0.11);
    --accent-border:rgba(45,212,191,0.24);
    --item:#171a1e;
    --chip:#1d2127;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35),0 8px 24px -8px rgba(0,0,0,0.45);
    --shadow-md:0 16px 40px -14px rgba(0,0,0,0.6),0 4px 12px -2px rgba(0,0,0,0.35);
    --sky1:#151921;
    --sky2:#111317;
    --fill1:#2dd4bf;
    --fill2:#0d9488;
  }
}

:root[data-theme="dark"]{
  --page:#0b0c0e;
  --card:#121417;
  --ink:#f4f4f5;
  --sub:#b6b6c0;
  --muted:#9a9aa4;
  --field:#1b1e23;
  --line:rgba(255,255,255,0.07);
  --accent:#2dd4bf;
  --accent-soft:rgba(45,212,191,0.11);
  --accent-border:rgba(45,212,191,0.24);
  --item:#171a1e;
  --chip:#1d2127;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.35),0 8px 24px -8px rgba(0,0,0,0.45);
  --shadow-md:0 16px 40px -14px rgba(0,0,0,0.6),0 4px 12px -2px rgba(0,0,0,0.35);
  --sky1:#151921;
  --sky2:#111317;
  --fill1:#2dd4bf;
  --fill2:#0d9488;
}

*{box-sizing:border-box}
[hidden]{display:none!important}

html,body{
  margin:0;
  padding:0;
  background:var(--page);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.6;
  letter-spacing:-0.011em;
  -webkit-font-smoothing:antialiased;
}

body{
  min-height:100dvh;
  padding:28px 16px 48px;
}

/* Main Minimal Container */
.card{
  max-width:640px;
  margin:0 auto;
  padding:32px;
  background:var(--card);
  border-radius:28px;
  box-shadow:var(--shadow-md);
}

/* Header & Typography Hierarchy */
.head{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:24px;
}
.head .mark{
  width:40px;
  height:40px;
  border-radius:14px;
  background:var(--accent-soft);
  color:var(--accent);
  display:grid;
  place-items:center;
  font-size:19px;
  flex:none;
}
.head h1{
  font-family:var(--title);
  font-size:22px;
  font-weight:700;
  line-height:1.25;
  letter-spacing:-0.025em;
  margin:0;
  flex:1;
}
.badge{
  background:var(--accent-soft);
  color:var(--accent);
  font-family:var(--body);
  font-weight:600;
  font-size:12px;
  letter-spacing:0.02em;
  padding:6px 12px;
  border-radius:999px;
}

/* Inputs & Controls */
input,textarea{
  width:100%;
  border:1px solid transparent;
  background:var(--field);
  color:var(--ink);
  border-radius:14px;
  padding:13px 16px;
  font:400 15px/1.5 var(--body);
  letter-spacing:-0.01em;
  outline:none;
  transition:background-color .2s ease,box-shadow .2s ease,border-color .2s ease;
}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus,textarea:focus{
  background:var(--card);
  border-color:var(--accent-border);
  box-shadow:0 0 0 4px var(--accent-soft);
}

button{
  font-family:var(--body);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:transform .16s cubic-bezier(.22,1,.36,1),background-color .2s ease,color .2s ease,box-shadow .2s ease,opacity .2s ease;
}
button:not(:disabled):hover{opacity:0.92}
button:not(:disabled):active{transform:scale(0.97)}
button:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

.row{display:flex;gap:12px;margin-top:14px}
.row .add{flex:none}
.add{
  background:var(--accent);
  color:#ffffff;
  border:0;
  border-radius:14px;
  font-weight:600;
  font-size:14px;
  letter-spacing:-0.01em;
  padding:12px 20px;
  white-space:nowrap;
  box-shadow:0 4px 14px -4px var(--accent-border);
}
:root[data-theme="dark"] .add{color:#0b1110}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .add{color:#0b1110}
}

/* Segmented Navigation Tabs */
.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  padding:5px;
  background:var(--field);
  border-radius:16px;
  margin:0 0 24px;
}
.tab{
  border:0;
  background:transparent;
  color:var(--sub);
  font-weight:600;
  font-size:14px;
  letter-spacing:-0.01em;
  padding:10px 12px;
  border-radius:12px;
}
.tab.on{
  background:var(--card);
  color:var(--ink);
  box-shadow:var(--shadow-sm);
}

/* Chips & Filter Pills */
.chips{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.chip{
  height:34px;
  padding:0 14px;
  border-radius:999px;
  border:0;
  background:var(--chip);
  color:var(--sub);
  font-weight:500;
  font-size:13px;
  letter-spacing:-0.01em;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.chip.on{
  background:var(--accent);
  color:#ffffff;
  font-weight:600;
}
:root[data-theme="dark"] .chip.on{color:#0b1110}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .chip.on{color:#0b1110}
}

/* Hero Overview Card */
.hero{
  background:var(--item);
  border-radius:22px;
  padding:22px 24px;
  margin-bottom:24px;
  box-shadow:var(--shadow-sm);
}
.hero .t1{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:12px;
  font-size:17px;
  font-weight:700;
  letter-spacing:-0.02em;
}
.hero .t1 span:last-child{
  font-size:14px;
  font-weight:600;
  color:var(--accent);
}
.hero .t2{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  color:var(--sub);
  margin-top:10px;
}

/* Progress Bar */
.bar{
  height:8px;
  border-radius:999px;
  background:var(--field);
  overflow:hidden;
  margin-top:12px;
}
.bar>i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--fill1),var(--fill2));
  border-radius:999px;
  transition:width .55s cubic-bezier(.22,1,.36,1);
  min-width:0;
}

.strip{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid var(--line);
  font-size:13px;
  font-weight:500;
  color:var(--sub);
  cursor:pointer;
}
.strip .go{
  margin-left:auto;
  font-size:12px;
  font-weight:600;
  color:var(--accent);
  letter-spacing:-0.01em;
}

/* Daily Mission Card */
.mission{
  background:var(--item);
  border-radius:22px;
  padding:22px 24px;
  margin-bottom:24px;
  box-shadow:var(--shadow-sm);
}
.mission-kicker{
  font-size:11px;
  font-weight:600;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:6px;
}
.mission-title{
  font-size:16px;
  font-weight:600;
  letter-spacing:-0.015em;
  color:var(--ink);
}
.mrow,.ybtns{
  display:flex;
  gap:10px;
  margin-top:16px;
  flex-wrap:wrap;
}
.mrow button,.ybtns button{
  border:0;
  border-radius:12px;
  background:var(--accent);
  color:#ffffff;
  font-weight:600;
  font-size:13px;
  padding:10px 16px;
  white-space:nowrap;
}
:root[data-theme="dark"] .mrow button,:root[data-theme="dark"] .ybtns button{color:#0b1110}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .mrow button,:root:not([data-theme="light"]) .ybtns button{color:#0b1110}
}
.mrow .sub,.ybtns .sub{
  background:var(--chip);
  color:var(--sub);
}

/* Where I left off summary */
.upto{background:var(--item);border-radius:22px;padding:20px 24px;margin-bottom:24px;box-shadow:var(--shadow-sm)}
.upr{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.upr:last-child{border-bottom:0;padding-bottom:0}
.upn{font-weight:600;font-size:14px;flex:0 0 40%;letter-spacing:-0.01em}
.upt{font-size:13px;color:var(--ink);flex:1;line-height:1.5;word-break:break-word}
.upt small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.upt.none{color:var(--muted)}
.upgo{color:var(--accent);font-weight:600;font-size:12px;flex:none;align-self:center}
.qk{display:flex;gap:8px;flex-wrap:wrap}

.uph{display:flex;align-items:center;gap:12px;cursor:pointer}
.uph>div{flex:1;min-width:0}
.uparrow{color:var(--muted);font-size:16px;flex:none}
.upsum{font-size:13px;color:var(--sub);margin-top:4px}
.upr:first-of-type{margin-top:8px}

/* Day-level check */
.dpanel{margin-top:14px;padding:16px;background:var(--card);border-radius:16px;box-shadow:var(--shadow-sm)}
.dsel{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.dsel select{border:1px solid transparent;background:var(--field);color:var(--ink);border-radius:12px;padding:9px 12px;font:500 14px var(--body)}
.dcal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dh{text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.dd{aspect-ratio:1;border:0;border-radius:9px;background:var(--field);color:var(--sub);font:500 13px var(--body);padding:0;min-width:0}
.dd.s2{background:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .dd.s2{color:#0b1110}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dd.s2{color:#0b1110}}
.dd.s3{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.dd.blank{background:transparent;cursor:default}
.dd.fut{opacity:.28;cursor:default}
.dd.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.dd:not(.fut):not(.blank):hover{transform:scale(1.08)}
.dfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:12px}
.dbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* Source Cards */
.src{
  background:var(--item);
  border-radius:22px;
  padding:22px 24px;
  margin-bottom:20px;
  box-shadow:var(--shadow-sm);
}
.sh{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:600;
  font-size:16px;
  letter-spacing:-0.015em;
}
.dots{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:18px;
  padding:4px 8px;
  border-radius:10px;
}
.dots:hover{background:var(--chip);color:var(--ink)}

/* Monthly Grid */
.gr{
  display:grid;
  grid-template-columns:36px repeat(12,1fr);
  gap:5px;
  margin-top:18px;
  align-items:center;
}
.gr .yl{
  font-weight:600;
  color:var(--sub);
  font-size:11px;
  letter-spacing:0.01em;
}
.gr .mh{
  text-align:center;
  font-size:11px;
  font-weight:500;
  color:var(--muted);
}
.c{
  aspect-ratio:1;
  border-radius:8px;
  border:0;
  background:var(--field);
  color:var(--sub);
  font-weight:500;
  font-size:11px;
  padding:0;
  min-width:0;
}
.c:not(.fut):hover{transform:scale(1.08)}
.c.s1{background:#f59e0b;color:#ffffff;font-weight:600}
.c.s2{background:var(--accent);color:#ffffff;font-weight:600}
:root[data-theme="dark"] .c.s2{color:#0b1110}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .c.s2{color:#0b1110}
}
.c.s3{
  background:transparent;
  box-shadow:inset 0 0 0 1px var(--line);
  color:var(--muted);
}
.c.fut{opacity:0.28;cursor:default}

.leg{
  display:flex;
  gap:14px;
  font-size:12px;
  color:var(--sub);
  margin-top:16px;
  flex-wrap:wrap;
  align-items:center;
}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:3px;
  background:var(--field);
}

/* Counter & List */
.cnt{
  font-family:var(--title);
  font-weight:700;
  font-size:34px;
  letter-spacing:-0.03em;
  text-align:center;
  margin:18px 0 4px;
}
.cnt small{
  font-family:var(--body);
  font-weight:400;
  font-size:13px;
  color:var(--sub);
  letter-spacing:-0.01em;
}
.tip{
  font-size:13px;
  color:var(--sub);
  margin-top:10px;
  line-height:1.55;
}
.cnt + .ybtns + .tip{text-align:center}

.li{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid var(--line);
  font-size:15px;
}
.li:last-of-type{border-bottom:0}
.li span{flex:1;word-break:break-word}
.li.done span{text-decoration:line-through;color:var(--muted)}
.ck{
  width:24px;
  height:24px;
  border-radius:8px;
  border:1.5px solid var(--accent);
  background:transparent;
  color:#ffffff;
  font-size:13px;
  padding:0;
  flex:none;
  display:grid;
  place-items:center;
}
.ck.on{background:var(--accent)}
:root[data-theme="dark"] .ck.on{color:#0b1110}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .ck.on{color:#0b1110}
}
.rb{
  width:28px;
  height:28px;
  border-radius:999px;
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:13px;
  display:grid;
  place-items:center;
  flex:none;
}
.rb:hover{background:var(--field);color:var(--ink)}

.mini{display:flex;gap:10px;margin-top:14px}
.mini input{padding:10px 14px;font-size:14px}
.mini button,.ed button{
  border:0;
  border-radius:12px;
  background:var(--accent);
  color:#ffffff;
  font-weight:600;
  font-size:13px;
  padding:10px 16px;
  flex:none;
  white-space:nowrap;
}
:root[data-theme="dark"] .mini button,:root[data-theme="dark"] .ed button{color:#0b1110}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .mini button,:root:not([data-theme="light"]) .ed button{color:#0b1110}
}

.ed{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap}
.ed input{padding:10px 14px;font-size:14px}
.ed .sub{background:var(--chip);color:var(--sub)}
.ed .danger{background:rgba(220,38,38,0.1);color:#dc2626}
:root[data-theme="dark"] .ed .danger{background:rgba(248,113,113,0.14);color:#fca5a5}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .ed .danger{background:rgba(248,113,113,0.14);color:#fca5a5}
}

/* Progress Checkpoint Row */
.up{margin-top:14px}
.up .line{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--field);
  border-radius:12px;
  padding:10px 14px;
  font-size:13px;
  color:var(--ink);
}
.up .line span{flex:1;word-break:break-word}
.up .line small{color:var(--muted);font-size:11px}
.up .ef{
  display:flex;
  flex-direction:column;
  gap:10px;
  background:var(--card);
  padding:14px;
  border-radius:16px;
  box-shadow:var(--shadow-sm);
}
.up .ef .mini{margin-top:2px}

/* Emoji Palette & Add Source */
.pal{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pe{
  width:38px;
  height:38px;
  border-radius:10px;
  border:0;
  background:var(--field);
  font-size:18px;
  padding:0;
}
.pe.on{
  background:var(--accent-soft);
  box-shadow:inset 0 0 0 1.5px var(--accent);
}
.emi{width:68px;flex:none;text-align:center;font-size:20px;padding:9px}
.erow{display:flex;align-items:center;gap:12px;margin-top:12px}

.addbox{
  background:var(--item);
  border-radius:22px;
  padding:20px 24px;
  margin-top:20px;
  box-shadow:var(--shadow-sm);
}

/* Log / Calendar / GitHub Contribution Matrix */
.lnav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:8px 0 18px;
}
.lnav span{
  font-size:17px;
  font-weight:700;
  letter-spacing:-0.02em;
}
.lnav button{
  width:36px;
  height:36px;
  border-radius:999px;
  border:0;
  background:var(--field);
  color:var(--ink);
  font-size:14px;
  display:grid;
  place-items:center;
}

.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.mcard{
  background:var(--item);
  border-radius:20px;
  padding:18px;
  min-width:0;
  box-shadow:var(--shadow-sm);
}
.mcard .mt{
  font-weight:600;
  font-size:14px;
  letter-spacing:-0.01em;
  margin-bottom:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dc{
  aspect-ratio:1;
  border:0;
  border-radius:7px;
  background:var(--field);
  color:var(--sub);
  font-weight:500;
  font-size:11px;
  padding:0;
  min-width:0;
}
.dc:not(.fut):not(.blank):hover{transform:scale(1.1)}
.dc.blank{background:transparent;cursor:default;color:var(--muted);opacity:0.45}
.dc.on{background:var(--accent);color:#ffffff;font-weight:600}
:root[data-theme="dark"] .dc.on{color:#0b1110}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .dc.on{color:#0b1110}
}
.dc.rest{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dc.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.dc.fut{opacity:0.28;cursor:default}
.mf{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  font-weight:600;
  color:var(--sub);
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid var(--line);
}

.wk{
  display:grid;
  grid-template-columns:116px repeat(7,minmax(0,1fr));
  gap:6px;
  align-items:center;
  margin-top:16px;
}
.wk .wl{
  font-size:13px;
  font-weight:500;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.wk .wh{
  text-align:center;
  font-size:11px;
  font-weight:600;
  color:var(--muted);
}

.stats{
  display:flex;
  justify-content:space-around;
  text-align:center;
  margin-top:18px;
  background:var(--item);
  border-radius:20px;
  padding:20px 12px;
  box-shadow:var(--shadow-sm);
}
.stats b{
  display:block;
  font-family:var(--title);
  font-weight:700;
  font-size:26px;
  letter-spacing:-0.025em;
}
.stats span{
  font-size:12px;
  color:var(--sub);
  margin-top:2px;
  display:block;
}

.gh-box{
  background:var(--item);
  border-radius:20px;
  padding:20px;
  box-shadow:var(--shadow-sm);
  margin-top:4px;
}
.gh-top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.gh-top b{
  font-size:15px;
  font-weight:700;
  letter-spacing:-0.015em;
}
.gh-top small{
  font-size:12px;
  color:var(--sub);
}
.gh-scroll{
  overflow-x:auto;
  padding-bottom:6px;
}
.gh-grid-wrap{
  display:grid;
  grid-template-columns:30px 1fr;
  column-gap:8px;
  row-gap:6px;
  min-width:max-content;
}
.gh-months{
  grid-column:2;
  display:grid;
  grid-template-columns:repeat(53,11px);
  column-gap:3px;
  font-size:11px;
  color:var(--muted);
  height:16px;
  align-items:center;
}
.gh-months span{white-space:nowrap}
.gh-days{
  grid-column:1;
  display:grid;
  grid-template-rows:repeat(7,1fr);
  gap:3px;
  font-size:10px;
  color:var(--muted);
  align-items:center;
}
.gh-days span{line-height:11px;height:11px}
.gh-cells{
  grid-column:2;
  display:grid;
  grid-auto-flow:column;
  grid-template-rows:repeat(7,11px);
  grid-auto-columns:11px;
  gap:3px;
}
.gh-cells i{
  width:11px;
  height:11px;
  border-radius:3px;
  background:var(--field);
  display:block;
}
.gh-cells i.h1{background:rgba(15,118,110,0.24)}
.gh-cells i.h2{background:rgba(15,118,110,0.52)}
.gh-cells i.h3{background:rgba(15,118,110,0.78)}
.gh-cells i.h4{background:var(--accent)}
:root[data-theme="dark"] .gh-cells i.h1{background:rgba(45,212,191,0.22)}
:root[data-theme="dark"] .gh-cells i.h2{background:rgba(45,212,191,0.45)}
:root[data-theme="dark"] .gh-cells i.h3{background:rgba(45,212,191,0.72)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .gh-cells i.h1{background:rgba(45,212,191,0.22)}
  :root:not([data-theme="light"]) .gh-cells i.h2{background:rgba(45,212,191,0.45)}
  :root:not([data-theme="light"]) .gh-cells i.h3{background:rgba(45,212,191,0.72)}
}
.gh-cells i.fut{opacity:0.22}
.gh-cells i.tdy{box-shadow:inset 0 0 0 1.5px var(--ink)}
.gh-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid var(--line);
  font-size:11px;
  color:var(--sub);
}
.gh-scale{
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.gh-scale i{
  width:11px;
  height:11px;
  border-radius:3px;
  background:var(--field);
  display:inline-block;
}
.gh-scale i.h1{background:rgba(15,118,110,0.24)}
.gh-scale i.h2{background:rgba(15,118,110,0.52)}
.gh-scale i.h3{background:rgba(15,118,110,0.78)}
.gh-scale i.h4{background:var(--accent)}
:root[data-theme="dark"] .gh-scale i.h1{background:rgba(45,212,191,0.22)}
:root[data-theme="dark"] .gh-scale i.h2{background:rgba(45,212,191,0.45)}
:root[data-theme="dark"] .gh-scale i.h3{background:rgba(45,212,191,0.72)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .gh-scale i.h1{background:rgba(45,212,191,0.22)}
  :root:not([data-theme="light"]) .gh-scale i.h2{background:rgba(45,212,191,0.45)}
  :root:not([data-theme="light"]) .gh-scale i.h3{background:rgba(45,212,191,0.72)}
}

.help{
  font-size:13px;
  color:var(--sub);
  margin-top:18px;
  line-height:1.65;
}

/* Terrarium & Landscape Garden View */
.ghead{text-align:center;margin-bottom:20px}
.gt{
  font-size:20px;
  font-weight:700;
  letter-spacing:-0.02em;
}
.gs{
  font-size:13px;
  color:var(--sub);
  margin-top:4px;
}
.terrarium-stage{
  background:var(--item);
  border-radius:24px;
  padding:20px;
  box-shadow:var(--shadow-sm);
}
.terrarium-svg{
  width:100%;
  height:auto;
  max-height:310px;
  display:block;
  border-radius:18px;
}
.terrarium-caption{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid var(--line);
  font-size:12px;
  color:var(--sub);
}
.terrarium-caption strong{
  color:var(--ink);
  font-weight:600;
}

.gcard{
  background:var(--item);
  border-radius:22px;
  padding:22px 24px;
  margin-top:18px;
  box-shadow:var(--shadow-sm);
}
.gcard h3{
  font-size:15px;
  font-weight:700;
  letter-spacing:-0.015em;
  margin:0 0 14px;
}

.env-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.env-item{
  background:var(--card);
  border-radius:16px;
  padding:14px 12px;
  text-align:center;
  box-shadow:0 1px 3px rgba(24,24,27,0.04);
}
.env-item.lock{opacity:0.42}
.env-item .ico{font-size:20px;line-height:1.2}
.env-item b{
  display:block;
  font-size:12px;
  font-weight:600;
  margin-top:6px;
  letter-spacing:-0.01em;
}
.env-item span{
  display:block;
  font-size:11px;
  color:var(--sub);
  margin-top:2px;
}

.ag{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ac{
  display:flex;
  gap:12px;
  align-items:center;
  padding:14px;
  border-radius:16px;
  background:var(--card);
  box-shadow:0 1px 3px rgba(24,24,27,0.04);
}
.ac .ae{font-size:22px;flex:none}
.ac.lock{opacity:0.48}
.ac b{font-size:13px;font-weight:600;display:block;letter-spacing:-0.01em}
.ac span{font-size:11px;color:var(--sub)}
.ac.ok{box-shadow:inset 0 0 0 1.5px var(--accent-border)}

.gs4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  text-align:center;
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid var(--line);
}
.gs4 b{display:block;font-size:20px;font-weight:700;letter-spacing:-0.02em}
.gs4 span{font-size:11px;color:var(--sub)}

/* Settings Panel & Footer */
.panel{
  display:none;
  margin-top:20px;
  padding:22px 24px;
  background:var(--item);
  border-radius:22px;
  box-shadow:var(--shadow-sm);
}
.panel.show{display:block}
.panel textarea{height:110px;resize:vertical;font-size:13px}
.cfg label{
  display:block;
  font-size:12px;
  font-weight:600;
  color:var(--sub);
  margin:14px 0 6px;
  letter-spacing:-0.01em;
}
.cfg label:first-child{margin-top:0}
.cfg .chips{margin-bottom:8px}

.msg{
  font-size:13px;
  font-weight:500;
  color:var(--accent);
  margin-top:14px;
  min-height:18px;
}

.foot{
  display:flex;
  align-items:center;
  margin-top:28px;
  padding-top:18px;
  border-top:1px solid var(--line);
}
.lab{
  flex:1;
  font-size:11px;
  letter-spacing:0.08em;
  font-weight:600;
  color:var(--muted);
  text-transform:uppercase;
  display:flex;
  align-items:center;
  gap:8px;
}
.lab i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--accent);
}
.lab i.busy{background:#f59e0b}
.lab i.err{background:#ef4444}
.lab i.off{background:var(--muted);opacity:0.5}
.fb{
  width:38px;
  height:38px;
  border-radius:999px;
  border:0;
  background:var(--field);
  color:var(--sub);
  font-size:16px;
  display:grid;
  place-items:center;
}
.fb:hover{color:var(--ink)}

.fly{
  position:fixed;
  top:-30px;
  font-size:22px;
  animation:fall 2s ease-in forwards;
  pointer-events:none;
  z-index:50;
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(240deg);opacity:0}
}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

@media (max-width:540px){
  body{padding:16px 12px 36px}
  .card{padding:22px 18px;border-radius:24px}
  .hero,.mission,.src,.gcard,.addbox,.panel,.terrarium-stage,.gh-box{padding:18px;border-radius:20px}
  .mgrid,.ag{grid-template-columns:1fr}
  .env-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wk{grid-template-columns:88px repeat(7,minmax(0,1fr));gap:4px}
  .gr{gap:3px;grid-template-columns:32px repeat(12,1fr)}
  .stats b{font-size:22px}
}

/* ===== readability v12 ===== */
html{-webkit-text-size-adjust:100%}
html,body{line-height:1.65;font-size:16px}
.card,.card *{word-break:keep-all;overflow-wrap:anywhere}
input,select,textarea{word-break:normal;overflow-wrap:normal}
button{touch-action:manipulation}
.badge{font-size:13px}
.tab{font-size:15px;padding:12px 10px;min-height:44px}
.chip{font-size:14px;height:38px;padding:0 16px}
.add,.mini button,.ed button,.mrow button,.ybtns button{font-size:14px;min-height:40px}
.hero .t1{font-size:19px}.hero .t2{font-size:14px}
.strip{font-size:14px}.strip .go{font-size:13px}
.mission-kicker{font-size:12px;letter-spacing:.05em}
.mission-title{font-size:18px;line-height:1.45}
.tip{font-size:14px;line-height:1.6}
.help{font-size:14px}
.sh{font-size:17px}
.gr .yl{font-size:12px;color:var(--sub)}
.gr .mh{font-size:12px;color:var(--sub)}
.c{font-size:12px;font-weight:600}
.leg{font-size:13px}
.cnt small{font-size:14px;color:var(--sub)}
.li{font-size:16px}
.up .line{font-size:14px;line-height:1.55}
.up .line small{font-size:12px;color:var(--sub)}
.lnav span{font-size:18px}
.mcard .mt{font-size:15px}
.dc{font-size:13px;font-weight:600}
.dc.blank{opacity:.35}
.mf{font-size:13px}
.wk .wl{font-size:14px}.wk .wh{font-size:12px;color:var(--sub)}
.stats span{font-size:13px}
.gh-top b{font-size:16px}.gh-top small{font-size:13px}
.gh-months{font-size:12px;color:var(--sub)}.gh-days{font-size:11px;color:var(--sub)}
.gh-foot{font-size:12px}
.gh-scale{font-size:12px}
.terrarium-caption{font-size:13px}
.env-item b{font-size:13px}.env-item span{font-size:12px}
.ac b{font-size:14px}.ac span{font-size:12px}
.gs{font-size:14px}.gs4 span{font-size:12px}
.gcard h3{font-size:16px}
.dh{font-size:12px;color:var(--sub)}.dd{font-size:14px}.dfoot{font-size:13px}
.cfg label{font-size:13px}
.msg{font-size:14px}
.lab{font-size:12px}
.pe{width:42px;height:42px;font-size:20px}
.src>.chip{margin-left:0!important;margin-right:8px}
/* dark mode: secondary buttons keep readable text */
:root[data-theme="dark"] .mrow button.sub,:root[data-theme="dark"] .ybtns button.sub,:root[data-theme="dark"] .mini button.sub,:root[data-theme="dark"] .ed button.sub{color:var(--sub)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mrow button.sub,:root:not([data-theme="light"]) .ybtns button.sub,:root:not([data-theme="light"]) .mini button.sub,:root:not([data-theme="light"]) .ed button.sub{color:var(--sub)}}
/* checkpoint summary rows: name on top, detail below */
.upr{display:grid;grid-template-columns:1fr auto;column-gap:12px;row-gap:2px;align-items:start;padding:14px 0}
.upn{grid-column:1;font-size:15px;flex:none}
.upt{grid-column:1;font-size:14px;line-height:1.55}
.upt small{font-size:12px;color:var(--sub)}
.upt.none{color:var(--sub)}
.upgo{grid-column:2;grid-row:1/3;align-self:center;font-size:13px;background:var(--accent-soft);padding:6px 12px;border-radius:999px}
.upsum{font-size:14px}
@media (max-width:540px){
  .card{padding:20px 16px}
  .hero,.mission,.src,.gcard,.addbox,.panel,.terrarium-stage,.gh-box,.upto{padding:18px 16px}
  .chips{gap:8px}
  .gr{gap:3px}
}

/* ===== wide screens: use the space (2 columns), phones stay 1 column ===== */
@media (min-width:860px){
  body{padding:28px 24px 56px}
  .card{max-width:1160px;padding:36px 40px}
  .card>.tabs{max-width:560px}
  #logv>.tabs{max-width:460px}
  .top2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start;margin-bottom:24px}
  .top2 .mission,.top2 .upto{margin-bottom:0}
  #src{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
  #src .src{margin-bottom:0}
  #src .addbox{grid-column:1/-1;margin-top:0}
  #garden{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
  #garden .ghead,#garden .terrarium-stage,#garden .gcard:last-child{grid-column:1/-1}
  #garden .gcard{margin-top:0}
  .terrarium-svg{max-width:680px;margin:0 auto}
  .mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (min-width:1280px){
  .card{max-width:1280px}
  .mgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* =====================================================================
   v14 기능 스타일: 상태 바 · 접는 카드 · 토스트 · 촘촘/차분 모드
   ===================================================================== */
.icon-btn{width:40px;height:40px;border-radius:999px;border:0;background:var(--field);color:var(--sub);font-size:16px;display:grid;place-items:center;flex:none}
.icon-btn:hover{color:var(--ink)}
/* 상태 바 */
.status-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-8px 0 20px}
.status-pill{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:5px 12px;border-radius:999px;background:var(--item);border:1px solid var(--line);color:var(--sub);font-size:13px;font-weight:600}
.status-pill strong{color:var(--ink);font-weight:700}
.status-pill.on{border-color:var(--accent-border);background:var(--accent-soft);color:var(--accent)}
.status-pill.on strong{color:var(--accent)}
.revisit-btn{min-height:36px;padding:5px 13px;border-radius:999px;border:1px solid var(--accent-border);background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 포커스 칩 (가로 스크롤) */
.fchips{display:flex;gap:8px;overflow-x:auto;margin:10px 0 4px;padding-bottom:4px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips .chip{flex:none;height:34px;font-size:13px}
/* 다음 한 칸 추천 */
.next-step-hint{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--sub)}
.next-step-hint strong{color:var(--ink);font-weight:600}
.nsg{display:flex;gap:6px;flex-wrap:wrap}
.next-step-btn{border:1px solid var(--accent-border);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 14px;min-height:36px;font-size:13px;font-weight:700}
.empty-state{margin-top:12px;padding:13px 15px;border-radius:14px;background:var(--card);border:1px dashed var(--line);font-size:14px;color:var(--sub)}
.empty-state-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* 대상 카드 접기 */
.clean-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.clean-toolbar .chips{margin:0}
#src .clean-toolbar{grid-column:1/-1}
.src{position:relative;overflow:hidden}
.src-top-strip{position:absolute;top:0;left:0;right:0;height:3px;background:var(--field)}
.src-top-strip>i{display:block;height:100%;background:linear-gradient(90deg,var(--fill1),var(--fill2));transition:width .35s ease}
.sh-toggle{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);padding:4px 6px;margin-left:-6px;min-height:44px;border-radius:12px;display:flex;align-items:center;gap:8px;text-align:left;font:inherit;font-weight:600}
.sh-toggle:hover{background:var(--field)}
.sh-title{flex:1;min-width:0;line-height:1.35}
.rem-badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--sub);flex:none}
.rem-badge.done{background:var(--accent-soft);color:var(--accent)}
.sh-pct{color:var(--accent);font-size:15px;font-weight:700;flex:none}
.sh-chev{color:var(--muted);font-size:13px;flex:none;width:12px;text-align:center}
.src.folded{padding-top:14px;padding-bottom:14px}
/* 연도 한 번에 완료 */
.ybulk-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px}
.ybulk-row>span{font-size:13px;color:var(--sub);margin-right:2px}
.ybulk{border:0;background:var(--chip);color:var(--sub);border-radius:999px;padding:0 12px;height:32px;font-size:13px;font-weight:600}
.ybulk.on{background:var(--accent-soft);color:var(--accent)}
/* 잔디 날짜 요약 */
.gh-cells i:not(.fut){cursor:pointer}
.gh-cells i.sel{outline:2px solid var(--ink);outline-offset:1px}
.day-summary{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--card);font-size:14px;line-height:1.6;color:var(--ink);white-space:pre-line}
.next-unlock{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--card);font-size:14px;line-height:1.55;color:var(--ink);box-shadow:var(--shadow-sm)}
.terrarium-svg{cursor:pointer}
/* 저장 시각 */
.save-stamp{font-size:12px;color:var(--sub);margin-right:10px;white-space:nowrap}
/* 토스트(+실행 취소): 화면 아래에 떠서 어디서 눌러도 보임 */
.msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;width:max-content;max-width:calc(100vw - 32px);margin:0;padding:11px 16px;border-radius:14px;background:var(--ink);color:var(--card);box-shadow:var(--shadow-md);display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;line-height:1.45}
.msg:empty{display:none}
.msg-undo{border:0;background:transparent;color:#5eead4;font-weight:700;font-size:14px;padding:4px 2px;min-height:32px;flex:none}
:root[data-theme="dark"] .msg-undo{color:#0f766e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .msg-undo{color:#0f766e}}
.foot{padding-bottom:4px}
/* 설정 패널 보조 */
.cfg .hint{font-size:13px;color:var(--sub);margin:4px 0 8px;line-height:1.5}
/* 촘촘하게 보기 (노션 임베드용) */
body.compact{padding:12px 10px 28px}

<script>
/* ==========================================================================
   Clean Quest v15 — 코드 지도
   --------------------------------------------------------------------------
    0. 설정값 · 상태 ........ 키 이름, 칸 상태 뜻, 레벨/정원 표, S(앱 상태)
    1. 기본 도구 ............ $, el, btn, 날짜 글자 만들기, 연타 방지
    2. 데이터 저장 .......... 기본 대상, 정규화, 이 기기 저장/불러오기
    3. GitHub 동기화 · op ... 모든 데이터 변경은 op() 한 곳을 지나감
    4. 실행 취소 ............ 바뀐 칸만 기억했다가 그 칸만 되돌림
    5. 계산 ................ 진행률, XP, 연속 기록, 추천 한 칸
    6. 동작 ................ 칸 누르기, 체크, 카운터, 대상 추가/삭제
    7. 공통 화면 ............ 알림, 전체 그리기, Lv 카드, 상태 바
    8. 정리 탭 ............. 미션, 어디까지 했지, 대상 카드
    9. 기록 탭 ............. 잔디, 월간, 주간
   10. 정원 탭 ............. 테라리움 그림, 서울 시간대 빛
   11. 설정 패널 ........... GitHub, 화면 크기/글꼴/여백, JSON 백업
   12. 시작 ................ 날짜 감시, 첫 화면
   ========================================================================== */

/* ==========================================================================
   0. 설정값 · 상태
   ========================================================================== */
var KEY="cleanquest:v1";    /* 이 기기 저장 키 (v1부터 그대로 → 예전 데이터 유지) */
var CKEY="homevault:cfg";   /* GitHub 설정 (Home Vault와 같이 씀) */
var PATH="cleanup.json";    /* 데이터 저장소 안 파일 이름 */
var NOW=new Date(),CY=NOW.getFullYear(),CM=NOW.getMonth()+1;

/* 칸 상태 숫자의 뜻
   - 월 칸 grid    : 0 비움 · 1 진행 중 · 2 완료 · 3 해당 없음
   - 날짜 칸 days  : 2 완료 · 3 해당 없음
   - 기록 marks    : 1 완료 · 2 휴식                                    */
var STN=["비움","진행 중","완료","해당 없음"];
var TITLES=["이끼 씨앗","돌길 정원사","숲길 관리자","개울 설계자","생태 큐레이터","정원 마스터"];
var TERRARIUM_STAGES=["이끼 씨앗","돌길 테라리움","푸른 숲병","빛이 드는 숲","맑은 개울 정원","완숙한 생태병"];
var ENV_ITEMS=[
  {lv:1,ico:"🏖️",name:"모래·자갈 바닥",desc:"병 속 첫 지층"},
  {lv:2,ico:"🌱",name:"비단 이끼",desc:"촉촉한 초록 언덕"},
  {lv:3,ico:"🪴",name:"에케베리아",desc:"장미 모양 다육"},
  {lv:4,ico:"🌿",name:"고사리 숲",desc:"가늘고 부드러운 잎"},
  {lv:5,ico:"☘️",name:"알로에",desc:"뾰족한 잎 부채"},
  {lv:7,ico:"🥬",name:"연둣빛 세덤",desc:"두 번째 로제트"},
  {lv:8,ico:"🌸",name:"작은 꽃",desc:"분홍 꽃송이"},
  {lv:9,ico:"🌵",name:"황금 선인장",desc:"동글한 선인장"}
];
/* [id, 아이콘, 이름, 조건 설명, 달성 판정(gstats 결과)] */
var ACH=[
  ["pot","🪴","첫 정돈","첫 항목 정리하기",function(g){return g.cells+g.items+g.removed>=1}],
  ["lamp","🕯️","3일 리듬","3일 연속 정리하기",function(){return bestStreak()>=3}],
  ["fount","🌊","7일 흐름","7일 연속 정리하기",function(){return bestStreak()>=7}],
  ["sakura","🍃","한 해 완결","한 연도 전체 완료하기",function(g){return g.yok}],
  ["house","🪟","온전한 비움","대상 하나 100% 달성하기",function(g){return g.full}],
  ["bfly","🌾","10개 감소","카운터 10개 줄이기",function(g){return g.removed>=10}],
  ["mush","📦","5개 완료","체크리스트 5개 달성하기",function(g){return g.items>=5}],
  ["rain","✨","1000 XP","경험치 1000 모으기",function(){return xp()>=1000}]
];
var EMO=["💾","💿","📀","🗂️","📁","🖼️","📸","🎞️","🎬","▶️","💬","📱","💻","🖥️","☁️","📧","📝","📚","🎵","🎮","🧾","📦","🏠","⭐","🧹","✨","💡","🔖"];
var TYPE_EMOJI={list:"☑️",grid:"📅",count:"🔢"};
var TYPE_HINT={
  list:"폴더나 세부 작업을 하나씩 체크하며 진행할 때 적합합니다.",
  grid:"연·월 단위로 쌓인 사진이나 대화 기록을 정리할 때 적합합니다.",
  count:"남은 개수를 점차 줄여 나가는 항목에 적합합니다."
};

var CFG={user:"",repo:"",token:""};
var S={
  d:null,                 /* 데이터: GitHub cleanup.json 과 같은 모양 */
  /* --- 화면 상태 (새로고침하면 초기화) --- */
  mission:null,tab:"clean",lv:"green",cat:"all",my:CY,mm:CM,ws:null,
  ed:{},del:null,addOpen:false,nt:"list",ne:"",up:{},dv:{},
  pickedDay:"",armed:null,gTap:0,lvUp:null,
  /* --- 이 기기에만 저장 (PERSIST 목록) --- */
  theme:"",zoom:1,font:"noto",shown:null,tstyle:"bottle",uptoOpen:false,
  focusSrc:"all",collapsed:{},recent:null,session:null,
  density:"comfortable",calmEmbed:false,lastSavedAt:"",lastSyncedAt:""
};
var PERSIST=["theme","zoom","font","shown","tstyle","uptoOpen","focusSrc","collapsed","recent","session","density","calmEmbed","lastSavedAt","lastSyncedAt"];

/* ==========================================================================
   1. 기본 도구
   ========================================================================== */
function $(id){return document.getElementById(id)}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function btn(cls,text,fn){var b=el("button",cls,text);if(fn)b.onclick=fn;return b}
function add(parent){for(var i=1;i<arguments.length;i++)if(arguments[i])parent.appendChild(arguments[i]);return parent}
function pad(n){return n<10?"0"+n:""+n}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function ds(dt){return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate())}
function today(){return ds(new Date())}
function pdate(x){var p=x.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function sundayOf(dt){var x=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());x.setDate(x.getDate()-x.getDay());return x}
function daysIn(y,m){return new Date(y,m,0).getDate()}
function clone(x){return x===undefined?undefined:JSON.parse(JSON.stringify(x))}
function same(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function isObj(x){return !!x&&typeof x==="object"}
function keysOf(a,b){var k={};Object.keys(a||{}).forEach(function(x){k[x]=1});Object.keys(b||{}).forEach(function(x){k[x]=1});return Object.keys(k)}
function clock(){var t=new Date();return pad(t.getHours())+":"+pad(t.getMinutes())}
/* "2024-03-05" → "2024년 3월 5일" */
function fmtUp(x){var p=x.split("-");return p[0]+"년 "+(+p[1])+"월 "+(+p[2])+"일"}
/* "2024-03" → "2024년 3월" / 짧게 "24년 3월" */
function ymText(key){var p=key.split("-");return p[0]+"년 "+(+p[1])+"월"}
function ymShort(key){var p=key.split("-");return String(p[0]).slice(2)+"년 "+(+p[1])+"월"}
function scrollToEl(node,block){if(node&&node.scrollIntoView)node.scrollIntoView({behavior:"smooth",block:block||"start"})}
function isDark(){return document.documentElement.getAttribute("data-theme")==="dark"||(!S.theme&&window.matchMedia("(prefers-color-scheme: dark)").matches)}
/* 연타 방지: 두 번 눌림으로 상태가 두 칸 넘어가는 것 막기 */
var lastTap=0;
function tapGuard(ms){var n=Date.now();if(n-lastTap<(ms||140))return true;lastTap=n;return false}

/* ==========================================================================
   2. 데이터 저장
   ========================================================================== */
function seed(){return{sources:[
  {id:"kakao",name:"카카오톡 나에게 보내기",emoji:"💬",type:"grid",from:2020},
  {id:"yt",name:"유튜브 나중에 볼 영상",emoji:"▶️",type:"count"},
  {id:"g26",name:"S26 갤러리",emoji:"📱",type:"grid",from:2024},
  {id:"g22",name:"S22 갤러리",emoji:"📱",type:"grid",from:2022},
  {id:"hdd",name:"외장하드 1",emoji:"💾",type:"list"}],grid:{},counts:{},lists:{},act:{},marks:{},log:{},days:{}}}

function norm(d){
  d=d||{};
  if(!Array.isArray(d.sources)||!d.sources.length)d.sources=seed().sources;
  ["grid","counts","lists","act","marks","log","days"].forEach(function(k){d[k]=d[k]||{}});
  return d;
}
function cleanTok(t){t=String(t||"");var m=t.match(/(github_pat_|ghp_|gho_|ghu_|ghs_|ghr_)[A-Za-z0-9_]+/);return m?m[0]:t.replace(/[^\x21-\x7e]/g,"")}
function cleanName(t){return String(t||"").replace(/[^A-Za-z0-9._-]/g,"")}

/* 안전한 저장소: 사파리 개인정보 모드 등에서 localStorage가 막혀도 앱이 멈추지 않게 */
var MEM={};
function lsGet(k){try{var v=localStorage.getItem(k);return v!=null?v:(k in MEM?MEM[k]:null)}catch(e){return k in MEM?MEM[k]:null}}
function lsSet(k,v){MEM[k]=v;try{localStorage.setItem(k,v)}catch(e){}}

function loadState(){
  S.d=seed();
  try{
    var p=JSON.parse(lsGet(KEY)||"null");
    if(!p)return;
    if(p.d)S.d=norm(p.d);
    if(p.theme)S.theme=p.theme;
    if(p.zoom)S.zoom=p.zoom;
    if(p.font)S.font=p.font;
    if(p.shown!=null)S.shown=p.shown;
    if(p.tstyle)S.tstyle=p.tstyle;
    if(p.uptoOpen!=null)S.uptoOpen=p.uptoOpen;
    if(p.focusSrc)S.focusSrc=p.focusSrc;
    if(isObj(p.collapsed))S.collapsed=p.collapsed;
    if(isObj(p.recent))S.recent=p.recent;
    if(isObj(p.session))S.session={date:p.session.date||"",cleared:+p.session.cleared||0,xpGain:+p.session.xpGain||0};
    if(p.density==="compact"||p.density==="comfortable")S.density=p.density;
    if(p.calmEmbed!=null)S.calmEmbed=!!p.calmEmbed;
    if(typeof p.lastSavedAt==="string")S.lastSavedAt=p.lastSavedAt;
    if(typeof p.lastSyncedAt==="string")S.lastSyncedAt=p.lastSyncedAt;
  }catch(e){}
}
function loadCfg(){
  try{var q=JSON.parse(lsGet(CKEY)||"null");if(q)CFG={user:q.user||"",repo:q.repo||"",token:q.token||""}}catch(e){}
  CFG.token=cleanTok(CFG.token);CFG.user=cleanName(CFG.user);CFG.repo=cleanName(CFG.repo);
}
function save(){
  var o={d:S.d};
  PERSIST.forEach(function(k){o[k]=S[k]});
  try{lsSet(KEY,JSON.stringify(o))}catch(e){}
  renderStamp();
}
function saveCfg(){try{lsSet(CKEY,JSON.stringify(CFG))}catch(e){}}

/* ==========================================================================
   3. GitHub 동기화 · op
   --------------------------------------------------------------------------
   op(fn, o) — 데이터를 바꾸는 유일한 길
     ① fn 을 이 기기 데이터에 적용 → 저장 → 화면 다시 그림
     ② GitHub 최신본을 받아서 같은 fn 을 '한 번 더' 적용해 올림
        (통째로 덮어쓰지 않으니 다른 기기에서 바꾼 내용이 살아남음)
   o 옵션: src/label(방금 한 곳) · msg(알림) · undo(되돌리기 중) · noUndo
   ========================================================================== */
function synced(){return !!(CFG.user&&CFG.repo&&CFG.token)}
function setDot(k){$("dot").className=k}
function enc(t){return btoa(unescape(encodeURIComponent(t)))}
function dec(b){return decodeURIComponent(escape(atob(b.replace(/\n/g,""))))}
function url(get){return "https://api.github.com/repos/"+encodeURIComponent(CFG.user)+"/"+encodeURIComponent(CFG.repo)+"/contents/"+PATH+(get?"?t="+Date.now():"")}
function hdr(){return{"Authorization":"Bearer "+CFG.token,"Accept":"application/vnd.github+json"}}
function errText(e){
  var m=e&&e.message||"";
  if(m==="401")return "토큰이 거부됐어요. 길이 "+CFG.token.length+" (보통 93), 끝 ..."+CFG.token.slice(-4);
  if(m==="403")return "권한 없음: 토큰의 Contents를 Read and write로 해주세요";
  if(m==="404")return "아이디 또는 저장소 이름을 확인해 주세요";
  return "동기화 실패 ("+(m||"network")+")";
}
async function remoteGet(){
  var r=await fetch(url(true),{headers:hdr(),cache:"no-store"});
  if(r.status===404)return{d:null,sha:null};
  if(!r.ok)throw new Error(String(r.status));
  var j=await r.json();
  return{d:norm(JSON.parse(dec(j.content))),sha:j.sha};
}
async function remoteApply(fn,tries){
  var g=await remoteGet();
  var out=fn(g.d||clone(S.d));   /* 원격 파일이 없으면 이 기기 데이터를 올림 */
  var body={message:"Update cleanup progress",content:enc(JSON.stringify(out,null,1))};
  if(g.sha)body.sha=g.sha;
  var r=await fetch(url(false),{method:"PUT",headers:hdr(),body:JSON.stringify(body)});
  if((r.status===409||r.status===422)&&tries<2)return remoteApply(fn,tries+1);
  if(!r.ok)throw new Error(String(r.status));
  return out;
}
function onSyncFail(e){setDot("err");say(errText(e))}

var chain=Promise.resolve();
function op(fn,o){
  o=o||{};
  var before=clone(S.d),xb=xp(),ub=doneUnits(before),next;
  try{next=norm(fn(clone(S.d)))}catch(e){if(window.console)console.error(e);say("처리 중 문제가 생겨서 반영하지 않았어요");return}
  S.d=next;
  trackSession(xp()-xb,doneUnits(S.d)-ub,o.undo);
  if(o.src)setRecent(o.src,o.label);
  if(!o.undo&&!o.noUndo)rememberUndo(before,S.d);
  S.lastSavedAt=clock();
  S.lvUp=null;
  save();
  render();
  /* 레벨업 축하 문구가 있으면 그걸 우선 보여줌 (실행 취소 버튼은 그대로) */
  if(o.msg||S.lvUp)say(S.lvUp||o.msg,!o.undo);
  if(!synced())return;
  setDot("busy");
  chain=chain.then(function(){return remoteApply(fn,0)})
    .then(function(d){S.d=d;S.lastSyncedAt=clock();save();render();setDot("")})
    .catch(onSyncFail);
}
function pull(){
  loadHomeLocal();   /* [신규] */
  if(!synced()){setDot("off");render();return}
  setDot("busy");
  chain=chain.then(remoteGet)
    .then(function(g){if(g.d){S.d=g.d;S.lastSyncedAt=clock();save();render()}setDot("")})
    .then(function(){return fetchHome().catch(function(){})})   /* [신규] 집 정리 기록 (실패해도 조용히) */
    .catch(onSyncFail);
}

/* 오늘 세션 기록 (이 기기 기준) — 되돌리기는 줄이기만, 일반 작업은 늘리기만 */
function ensureSession(){var t=today();if(!S.session||S.session.date!==t)S.session={date:t,cleared:0,xpGain:0}}
function trackSession(dx,du,isUndo){
  ensureSession();
  if(isUndo){S.session.xpGain=Math.max(0,S.session.xpGain+Math.min(0,dx));S.session.cleared=Math.max(0,S.session.cleared+Math.min(0,du))}
  else{if(dx>0)S.session.xpGain+=dx;if(du>0)S.session.cleared+=du}
}
/* '방금 한 곳' 기억 */
function setRecent(id,detail){var s=srcById(id);if(!s)return;S.recent={srcId:id,label:s.emoji+" "+s.name+(detail?" · "+detail:"")}}

/* ==========================================================================
   4. 실행 취소
   --------------------------------------------------------------------------
   작업 전/후를 비교해서 '바뀐 칸'만 [영역, 키, 세부키, 예전 값] 으로 기억.
   되돌릴 때는 그 칸만 예전 값으로 돌리는 fn 을 만들어 op() 로 보냄
   → GitHub 에도 병합 방식으로 반영, 다른 기기 변경은 그대로.
   ========================================================================== */
var LAST_UNDO=null;
var FLAT_SECS=["log","counts"];               /* 키 하나 = 값 하나 */
var NESTED_SECS=["grid","act","marks","days"]; /* 대상 → 날짜/월 → 값 */

function idMap(list){var m={};(list||[]).forEach(function(it,i){m[it.id]={v:it,i:i}});return m}
function diffPatch(a,b){
  var P=[];
  FLAT_SECS.forEach(function(sec){
    var A=a[sec]||{},B=b[sec]||{};
    keysOf(A,B).forEach(function(k){if(!same(A[k],B[k]))P.push([sec,k,null,clone(A[k])])});
  });
  NESTED_SECS.forEach(function(sec){
    var A=a[sec]||{},B=b[sec]||{};
    keysOf(A,B).forEach(function(k){
      var av=A[k],bv=B[k];
      if(isObj(av)&&isObj(bv))keysOf(av,bv).forEach(function(x){if(!same(av[x],bv[x]))P.push([sec,k,x,clone(av[x])])});
      else if(!same(av,bv))P.push([sec,k,null,clone(av)]);
    });
  });
  /* 체크리스트: 항목 id 단위 → 다른 기기에서 새로 추가한 항목은 건드리지 않음 */
  var LA=a.lists||{},LB=b.lists||{};
  keysOf(LA,LB).forEach(function(k){
    var am=idMap(LA[k]),bm=idMap(LB[k]);
    keysOf(am,bm).forEach(function(id){
      var x=am[id]?am[id].v:undefined,y=bm[id]?bm[id].v:undefined;
      if(!same(x,y))P.push(["lists",k,{id:id,i:am[id]?am[id].i:-1},clone(x)]);
    });
  });
  /* 대상: id 단위, 원래 자리(순서)까지 기억 */
  var sa=idMap(a.sources),sb=idMap(b.sources);
  keysOf(sa,sb).forEach(function(id){
    var x=sa[id]?sa[id].v:undefined,y=sb[id]?sb[id].v:undefined;
    if(!same(x,y))P.push(["sources",id,sa[id]?sa[id].i:-1,clone(x)]);
  });
  return P;
}
/* 배열 L 에서 id 항목을 v 로 되돌림 (v 없으면 삭제, 없던 항목이면 원래 자리에 끼움) */
function restoreById(L,id,idx,v){
  var j=-1;L.forEach(function(it,i){if(it.id===id)j=i});
  if(v===undefined){if(j>=0)L.splice(j,1)}
  else if(j>=0)L[j]=clone(v);
  else L.splice(Math.min(idx,L.length),0,clone(v));
}
function applyPatch(d,p){
  var sec=p[0],k=p[1],sub=p[2],v=p[3];
  if(sec==="sources"){restoreById(d.sources,k,sub,v);return}
  d[sec]=d[sec]||{};
  if(sec==="lists"){restoreById(d.lists[k]=d.lists[k]||[],sub.id,sub.i,v);return}
  if(sub==null){if(v===undefined)delete d[sec][k];else d[sec][k]=clone(v);return}
  d[sec][k]=d[sec][k]||{};
  if(v===undefined)delete d[sec][k][sub];else d[sec][k][sub]=clone(v);
  if(!Object.keys(d[sec][k]).length)delete d[sec][k];
}
function patchFn(P){return function(d){P.forEach(function(p){applyPatch(d,p)});return d}}
function rememberUndo(before,after){var P=diffPatch(before,after);LAST_UNDO=P.length?{fn:patchFn(P),at:Date.now()}:null}
function runUndo(u){if(LAST_UNDO!==u)return;LAST_UNDO=null;op(u.fn,{undo:true});say("되돌렸어요")}

/* ==========================================================================
   5. 계산
   ========================================================================== */
function srcById(id){return S.d.sources.filter(function(s){return s.id===id})[0]}
function cellsOf(s){
  var a=[];
  for(var y=s.from;y<=CY;y++)for(var m=1;m<=12;m++){
    if(y===CY&&m>CM)break;
    a.push(y+"-"+pad(m));
  }
  return a;
}
function st(d,s,k){return ((d.grid[s.id]||{})[k])||0}
function dgt(d,s,k){return (((d.days||{})[s.id])||{})[k]||0}
function counterStarted(s){var c=S.d.counts[s.id];return !!(c&&c.total)}
/* 카운터는 시작 전이면 진행률을 보여줄 '일'이 없음 */
function hasWork(s){return s.type!=="count"||counterStarted(s)}
function pct(s,d){
  d=d||S.d;
  if(s.type==="count"){var c=d.counts[s.id];return c&&c.total?Math.round((c.total-c.left)/c.total*100):0}
  if(s.type==="list"){var L=d.lists[s.id]||[];return L.length?Math.round(L.filter(function(x){return x.done}).length/L.length*100):0}
  var rel=cellsOf(s).filter(function(k){return st(d,s,k)!==3});
  if(!rel.length)return 100;
  return Math.round(rel.filter(function(k){return st(d,s,k)===2}).length/rel.length*100);
}
function remainingCount(s){
  if(s.type==="count"){var c=S.d.counts[s.id];return c&&c.total?c.left:0}
  if(s.type==="list")return (S.d.lists[s.id]||[]).filter(function(i){return !i.done}).length;
  return cellsOf(s).filter(function(k){var v=st(S.d,s,k);return v!==2&&v!==3}).length;
}
function yearDone(d,s,y){
  var any=false;
  for(var m=1;m<=12;m++){
    if(y===CY&&m>CM)break;
    var v=st(d,s,y+"-"+pad(m));
    if(v===2)any=true;else if(v!==3)return false;
  }
  return any;
}
function lastCheck(s){var m=(S.d.days||{})[s.id]||{},last="";Object.keys(m).forEach(function(k){if(m[k]===2&&k>last)last=k});return last}

/* XP: 월 칸 완료 10 · 진행 중 3 · 해당 없음 1 · 날짜 체크 1 · 체크리스트 5 · 카운터 1개당 2 */
function xp(){
  var x=0;
  S.d.sources.forEach(function(s){
    if(s.type==="count"){var c=S.d.counts[s.id];if(c)x+=(c.total-c.left)*2}
    else if(s.type==="list"){(S.d.lists[s.id]||[]).forEach(function(i){if(i.done)x+=5})}
    else{
      cellsOf(s).forEach(function(k){var v=st(S.d,s,k);x+=v===2?10:v===1?3:v===3?1:0});
      var dm=(S.d.days||{})[s.id]||{};Object.keys(dm).forEach(function(k){if(dm[k]===2)x+=1});
    }
  });
  return x+homeEvents().length*HOME_XP;   /* [수정] 집 정리 경험치 */
}
function lvOf(x){return Math.floor(x/100)+1}
function lvl(){return lvOf(xp())}
function ttl(lv){return TITLES[Math.min(Math.floor((lv-1)/5),TITLES.length-1)]}
function stageOf(x){return TERRARIUM_STAGES[Math.min(Math.floor(x/60),TERRARIUM_STAGES.length-1)]}
/* '완료한 단위' 개수 (오늘 N건 세기용) */
function doneUnits(d){
  var n=0;
  d.sources.forEach(function(s){
    if(s.type==="count"){var c=d.counts[s.id];if(c)n+=Math.max(0,c.total-c.left)}
    else if(s.type==="list")(d.lists[s.id]||[]).forEach(function(i){if(i.done)n++});
    else{cellsOf(s).forEach(function(k){if(st(d,s,k)===2)n++});var dm=(d.days||{})[s.id]||{};Object.keys(dm).forEach(function(k){if(dm[k]===2)n++})}
  });
  return n;
}
function gstats(){
  var o={cells:0,items:0,removed:0,yok:false,full:false};
  S.d.sources.forEach(function(s){
    if(s.type==="grid"){
      var dn=0;cellsOf(s).forEach(function(k){if(st(S.d,s,k)===2)dn++});
      o.cells+=dn;
      for(var y=s.from;y<=CY;y++)if(yearDone(S.d,s,y))o.yok=true;
      if(dn>0&&pct(s)===100)o.full=true;
    }else if(s.type==="list"){
      var L=S.d.lists[s.id]||[],d2=L.filter(function(i){return i.done}).length;
      o.items+=d2;if(L.length&&d2===L.length)o.full=true;
    }else{
      var c=S.d.counts[s.id];
      if(c){o.removed+=c.total-c.left;if(c.total&&c.left===0)o.full=true}
    }
  });
  return o;
}

/* --- [신규] Home Vault 집 정리 (읽기만 함 · cleanup.json 에는 저장 안 함) ---
   Home Vault 서랍의 '🧹 정리 완료' 기록(box.tidy 날짜들)을 home.json 에서 읽어
   1번 = +15 XP, 잔디·연속 기록에도 하루 활동으로 셈. GitHub 연결 전이면 같은 주소의 이 기기 저장소에서 읽음 */
var HOME_XP=15,HOME={zones:null};
var HOME_CACHE={src:null,ev:[],by:{}};
function homeEvents(){
  if(HOME_CACHE.src===HOME.zones)return HOME_CACHE.ev;   /* 잔디(371칸)에서 자주 불려서 한 번만 계산 */
  var ev=[];
  (HOME.zones||[]).forEach(function(z){(z.boxes||[]).forEach(function(b){(Array.isArray(b.tidy)?b.tidy:[]).forEach(function(d){if(typeof d==="string")ev.push({date:d,box:b.name,zone:z.name})})})});
  ev.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
  var by={};ev.forEach(function(e){by[e.date]=(by[e.date]||0)+1});
  HOME_CACHE={src:HOME.zones,ev:ev,by:by};
  return ev;
}
function homeCount(date){homeEvents();return HOME_CACHE.by[date]||0}
function loadHomeLocal(){try{var p=JSON.parse(localStorage.getItem("homevault:v1")||"null");if(p&&p.data&&Array.isArray(p.data.zones))HOME.zones=p.data.zones}catch(e){}}
async function fetchHome(){
  var r=await fetch("https://api.github.com/repos/"+encodeURIComponent(CFG.user)+"/"+encodeURIComponent(CFG.repo)+"/contents/home.json?t="+Date.now(),{headers:hdr(),cache:"no-store"});
  if(!r.ok)return;   /* home.json 이 없거나 못 읽어도 Clean Quest 는 그대로 */
  var j=await r.json(),d=JSON.parse(dec(j.content));
  if(d&&Array.isArray(d.zones)){HOME.zones=d.zones;render()}
}

/* --- 날짜별 기록 (잔디 · 연속) --- */
function actN(id,date){return ((S.d.act[id]||{})[date])||0}
function mark(id,date){return ((S.d.marks[id]||{})[date])||0}
function dstate(id,date){if(actN(id,date)>0||mark(id,date)===1)return 1;if(mark(id,date)===2)return 2;return 0}
/* [수정] 집 정리한 날도 활동한 날로 */
function dayAny(date){if((S.d.log[date]||0)>0||homeCount(date)>0)return true;return S.d.sources.some(function(s){return dstate(s.id,date)===1})}
function dayCount(date){
  var n=0;
  S.d.sources.forEach(function(s){n+=actN(s.id,date)+(mark(s.id,date)===1?1:0)});
  return Math.max(n,S.d.log[date]||0)+homeCount(date);
}
function streak(){
  var n=0,t=new Date();
  if(!dayAny(ds(t)))t.setDate(t.getDate()-1);
  while(dayAny(ds(t))){n++;t.setDate(t.getDate()-1)}
  return n;
}
function bestStreak(){
  var keys={};
  Object.keys(S.d.log).forEach(function(k){keys[k]=1});
  Object.keys(S.d.act).forEach(function(i){Object.keys(S.d.act[i]).forEach(function(k){keys[k]=1})});
  Object.keys(S.d.marks).forEach(function(i){Object.keys(S.d.marks[i]).forEach(function(k){keys[k]=1})});
  homeEvents().forEach(function(e){keys[e.date]=1});   /* [수정] */
  var ks=Object.keys(keys).sort();
  if(!ks.length)return 0;
  var t=pdate(ks[0]),end=new Date(),best=0,run=0;
  while(ds(t)<=ds(end)){if(dayAny(ds(t))){run++;if(run>best)best=run}else run=0;t.setDate(t.getDate()+1)}
  return best;
}
/* 이번 주(일~토) 기록한 날 수 */
function weekDays(){var sun=sundayOf(new Date()),td=today(),n=0;for(var i=0;i<7;i++){var d=new Date(sun);d.setDate(d.getDate()+i);var k=ds(d);if(k<=td&&dayAny(k))n++}return n}
function yearContributionsCount(){
  var ago=new Date();ago.setFullYear(ago.getFullYear()-1);
  var minKey=ds(ago),td=today(),total=0;
  Object.keys(S.d.log).forEach(function(k){if(k>=minKey&&k<=td&&(S.d.log[k]||0)>0)total+=S.d.log[k]});
  homeEvents().forEach(function(e){if(e.date>=minKey&&e.date<=td)total++});   /* [수정] */
  return total;
}

/* --- 미션 · 포커스 · 추천 --- */
function focusList(){
  if(S.focusSrc!=="all"&&!srcById(S.focusSrc))S.focusSrc="all";
  return S.focusSrc==="all"?S.d.sources:S.d.sources.filter(function(s){return s.id===S.focusSrc});
}
function pickMission(){
  var cells=[],items=[];
  focusList().forEach(function(s){
    if(s.type==="grid")cellsOf(s).forEach(function(k){if(st(S.d,s,k)===0)cells.push({id:s.id,key:k})});
    if(s.type==="list")(S.d.lists[s.id]||[]).forEach(function(i){if(!i.done)items.push({id:s.id,item:i.id})});
  });
  var pool=(items.length&&(!cells.length||Math.random()<0.4))?items:cells;
  S.mission=pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
}
function mValid(m){
  if(S.focusSrc!=="all"&&m.id!==S.focusSrc)return false;
  var s=srcById(m.id);if(!s)return false;
  if(m.item)return (S.d.lists[s.id]||[]).some(function(i){return i.id===m.item&&!i.done});
  return st(S.d,s,m.key)===0;
}
function nextOpenSrc(id){
  var L=S.d.sources,i0=-1;L.forEach(function(s,i){if(s.id===id)i0=i});
  for(var k=1;k<=L.length;k++){var c=L[(i0+k)%L.length];if(c&&c.id!==id&&pct(c)<100)return c}
  return null;
}
/* 대상 하나에서 '지금 할 한 칸' */
function stepFor(s){
  if(remainingCount(s)<=0)return null;
  if(s.type==="count")return {s:s,text:s.emoji+" "+s.name+" · 1개 줄이기 (남은 "+remainingCount(s)+"개)",btn:"-1 처리",run:function(){chg(s,-1)}};
  if(s.type==="list"){
    var t=(S.d.lists[s.id]||[]).filter(function(i){return !i.done})[0];if(!t)return null;
    return {s:s,text:s.emoji+" "+s.name+" · "+t.t,btn:"바로 완료",run:function(){setItem(s,t.id,true)}};
  }
  var k=cellsOf(s).filter(function(x){return st(S.d,s,x)===0})[0];if(!k)return null;
  return {s:s,text:s.emoji+" "+s.name+" · "+ymText(k),btn:"1칸 완료",run:function(){if(tapGuard())return;setCell(s,k,2,{msg:ymText(k)+" → 완료"})}};
}
/* 추천 한 칸: ① 방금 하던 곳 이어서 ② 아니면 '끝이 가장 가까운' 대상 */
function nextBestStep(){
  var pool=focusList();
  if(S.recent&&S.recent.srcId){var r=srcById(S.recent.srcId);if(r&&pool.indexOf(r)>=0){var a=stepFor(r);if(a)return a}}
  var best=null,bestRem=1e9;
  pool.forEach(function(s){var rem=remainingCount(s);if(rem>0&&rem<bestRem){var c=stepFor(s);if(c){best=c;bestRem=rem}}});
  return best;
}

/* ==========================================================================
   6. 동작 — 화면 코드는 여기 함수만 부르고, 데이터는 여기서만 바꿈
   ========================================================================== */
function bump(d,id){var t=today();d.log[t]=(d.log[t]||0)+1;if(id){d.act[id]=d.act[id]||{};d.act[id][t]=(d.act[id][t]||0)+1}}
function burst(){
  var E=["✨","🌿","💧","🍃"];
  for(var i=0;i<18;i++){
    var f=el("span","fly",E[i%E.length]);
    f.style.left=Math.round(Math.random()*92)+"%";
    f.style.animationDelay=(Math.random()*0.5)+"s";
    document.body.appendChild(f);
    (function(x){setTimeout(function(){x.remove()},2400)})(f);
  }
}
/* 한 해를 다 끝냈거나 대상이 100%가 되면 축하 */
function celebrate(s,y,yearBefore,pctBefore){
  if(!yearBefore&&yearDone(S.d,s,y)){burst();say(y+"년 "+s.name+" 정리를 마쳤어요.",true)}
  else if(pctBefore<100&&pct(s)===100)say(s.name+" 정리를 모두 완료했어요.",true);
}

/* --- 월 칸 --- */
function setCell(s,key,val,o){
  o=o||{};o.src=s.id;if(!o.label)o.label=ymShort(key);
  op(function(d){
    d.grid[s.id]=d.grid[s.id]||{};
    if(val)d.grid[s.id][key]=val;else delete d.grid[s.id][key];
    if(val===1||val===2)bump(d,s.id);
    return d;
  },o);
}
/* 비움 → 진행 중 → 완료 → 해당 없음 → 비움 */
function cycle(s,key,y){
  if(tapGuard())return;
  var before=yearDone(S.d,s,y),was=pct(s),nv=(st(S.d,s,key)+1)%4;
  setCell(s,key,nv,{msg:ymText(key)+" → "+STN[nv]});
  celebrate(s,y,before,was);
}
/* 연도 한 번에 완료/해제 — 해당 없음 칸은 그대로, 이미 완료된 해면 완료 칸만 비움 */
function yearBulk(s,y){
  if(tapGuard(200))return;
  var wasDone=yearDone(S.d,s,y),was=pct(s);
  op(function(d){
    d.grid[s.id]=d.grid[s.id]||{};
    var changed=false;
    for(var m=1;m<=12;m++){
      if(y===CY&&m>CM)break;
      var k=y+"-"+pad(m),cur=d.grid[s.id][k]||0;
      if(wasDone){if(cur===2){delete d.grid[s.id][k];changed=true}}
      else if(cur!==2&&cur!==3){d.grid[s.id][k]=2;changed=true}
    }
    if(!wasDone&&changed)bump(d,s.id);
    return d;
  },{src:s.id,label:y+"년",msg:wasDone?y+"년 완료 표시를 해제했어요":y+"년 남은 달을 모두 완료했어요"});
  if(!wasDone&&yearDone(S.d,s,y))burst();
  if(was<100&&pct(s)===100)say(s.name+" 정리를 모두 완료했어요.",true);
}
function addPrevYear(s){op(function(d){d.sources.forEach(function(x){if(x.id===s.id&&x.from>2000)x.from--});return d})}

/* --- 날짜 칸 (월 칸은 날짜 칸을 자동으로 따라감) --- */
function monthSync(d,s,y,m){
  var key=y+"-"+pad(m),done=0,open=0,td=today();
  for(var i=1;i<=daysIn(y,m);i++){var dt=key+"-"+pad(i);if(dt>td)break;var v=dgt(d,s,dt);if(v===2)done++;else if(v!==3)open++}
  d.grid[s.id]=d.grid[s.id]||{};
  var cur=d.grid[s.id][key]||0;
  if(done>0&&open===0)d.grid[s.id][key]=2;
  else if(done>0)d.grid[s.id][key]=1;
  else if(cur===1||cur===2)delete d.grid[s.id][key];
}
/* 비움 → 완료(✓) → 해당 없음(–) → 비움 */
function dayCycle(s,date){
  if(tapGuard())return;
  var cur=dgt(S.d,s,date),nv=cur===0?2:cur===2?3:0,y=+date.slice(0,4),m=+date.slice(5,7),before=yearDone(S.d,s,y),was=pct(s);
  op(function(d){
    d.days[s.id]=d.days[s.id]||{};
    if(nv)d.days[s.id][date]=nv;else delete d.days[s.id][date];
    monthSync(d,s,y,m);
    if(nv===2)bump(d,s.id);
    return d;
  },{src:s.id,label:m+"/"+(+date.slice(8))+" 체크",msg:m+"월 "+(+date.slice(8))+"일 → "+(nv===2?"완료":nv===3?"해당 없음":"비움")});
  celebrate(s,y,before,was);
}
function dayBulk(s,y,m,mode){
  if(tapGuard(200))return;
  op(function(d){
    d.days[s.id]=d.days[s.id]||{};
    var td=today();
    for(var i=1;i<=daysIn(y,m);i++){var dt=y+"-"+pad(m)+"-"+pad(i);if(dt>td)break;
      if(mode==="all"){if(d.days[s.id][dt]!==3)d.days[s.id][dt]=2}else delete d.days[s.id][dt]}
    monthSync(d,s,y,m);
    if(mode==="all")bump(d,s.id);
    return d;
  },{src:s.id,label:m+"월",msg:y+"년 "+m+"월 "+(mode==="all"?"전체 완료":"비우기")+" 했어요"});
}

/* --- 카운터 --- */
function setCount(s,n){op(function(d){d.counts[s.id]={total:n,left:n};return d},{src:s.id,label:n+"개 시작"})}
function chg(s,delta){
  var c=S.d.counts[s.id];if(!c)return;
  if(tapGuard(120))return;
  var left=Math.max(0,c.left+delta);
  op(function(d){
    var x=d.counts[s.id]||{total:0,left:0};
    if(delta<0)x.left=Math.max(0,x.left+delta);else{x.left+=delta;x.total+=delta}
    d.counts[s.id]=x;
    if(delta<0)bump(d,s.id);
    return d;
  },{src:s.id,label:"남은 "+left+"개",msg:s.name+" "+(delta>0?"+"+delta:delta)+" · 남은 "+left+"개"});
  if(delta<0&&S.d.counts[s.id].left===0){burst();say(s.name+" 항목을 모두 정리했어요.",true)}
}
function resetCount(s){op(function(d){delete d.counts[s.id];return d},{msg:s.name+" 카운터를 초기화했어요"})}

/* --- 체크리스트 --- */
function setItem(s,id,val){
  if(tapGuard())return;
  var was=pct(s),it=(S.d.lists[s.id]||[]).filter(function(x){return x.id===id})[0],nm=it?it.t:"항목";
  op(function(d){
    (d.lists[s.id]||[]).forEach(function(x){if(x.id===id)x.done=val});
    if(val)bump(d,s.id);
    return d;
  },{src:s.id,label:nm,msg:"'"+nm+"' "+(val?"완료":"완료 해제")});
  if(val&&was<100&&pct(s)===100){burst();say(s.name+" 정리를 모두 완료했어요.",true)}
}
function addItem(s,text){op(function(d){d.lists[s.id]=d.lists[s.id]||[];d.lists[s.id].push({id:uid(),t:text,done:false});return d})}
function removeItem(s,it){op(function(d){d.lists[s.id]=(d.lists[s.id]||[]).filter(function(i){return i.id!==it.id});return d},{msg:"'"+it.t+"' 삭제했어요"})}

/* --- 대상 --- */
function addSource(name,emoji,type,from){
  op(function(d){var n={id:uid(),name:name,emoji:emoji,type:type};if(type==="grid")n.from=from;d.sources.push(n);return d});
}
function renameSource(s,name,emoji){
  op(function(d){d.sources.forEach(function(x){if(x.id===s.id){x.name=name;if(emoji)x.emoji=emoji}});return d});
}
function deleteSource(s){
  S.del=null;delete S.collapsed[s.id];if(S.focusSrc===s.id)S.focusSrc="all";
  op(function(d){
    d.sources=d.sources.filter(function(x){return x.id!==s.id});
    delete d.grid[s.id];delete d.counts[s.id];delete d.lists[s.id];delete d.days[s.id];
    return d;
  },{msg:"'"+s.name+"' 대상을 삭제했어요"});
}
/* 어디까지 했지 메모 (날짜 · 메모 둘 다 비우면 기록 삭제) */
function setUp(s,dv,nv){
  op(function(d){
    d.sources.forEach(function(x){
      if(x.id===s.id){
        if(dv||nv){x.upto=dv;x.unote=nv;x.uat=today()}
        else{delete x.upto;delete x.unote;delete x.uat}
      }
    });
    return d;
  });
}
/* 기록 탭 날짜 표시: 비움 → 완료 → 휴식 (정리한 날은 이미 자동 기록) */
function toggleDay(id,date){
  if(actN(id,date)>0){say("정리 활동이 기록된 날입니다.");return}
  var nv=(mark(id,date)+1)%3;
  op(function(d){d.marks[id]=d.marks[id]||{};if(nv)d.marks[id][date]=nv;else delete d.marks[id][date];return d});
}

var msgTimer=null;
function say(m,undoable){
  var box=$("msg");box.textContent="";
  if(m)box.appendChild(document.createTextNode(m));
  var canUndo=!!(undoable&&LAST_UNDO&&Date.now()-LAST_UNDO.at<2000);

  clearTimeout(msgTimer);
  msgTimer=setTimeout(function(){$("msg").textContent=""},canUndo?8000:4500);
}

/* 다시 그려도 입력 중인 글자·커서가 사라지지 않게 (data-k 로 구분) */
function keep(fn){
  var a=document.activeElement,act=a&&a.dataset?a.dataset.k:null,vals={};
  document.querySelectorAll("[data-k]").forEach(function(e){vals[e.dataset.k]=e.value});
  fn();
  document.querySelectorAll("[data-k]").forEach(function(e){if(vals[e.dataset.k]!=null)e.value=vals[e.dataset.k]});
  if(act){var t=document.querySelector('[data-k="'+act+'"]');if(t)t.focus()}
}

function renderMission(){
  var m=$("mission");m.textContent="";
  if(S.mission&&!mValid(S.mission))S.mission=null;
  if(!S.mission)pickMission();
  m.appendChild(el("div","mission-kicker","TODAY'S FOCUS"));
  if(S.d.sources.length>1){
    var opts=[{id:"all",label:"✦ 전체"}].concat(S.d.sources.map(function(s){return {id:s.id,label:s.emoji+" "+s.name}}));
    m.appendChild(chipRow("fchips",opts,function(c){return S.focusSrc===c.id},function(c){setFocus(c.id)}));
  }
  if(!S.mission){missionEmpty(m);nextHint(m);return}

  var s=srcById(S.mission.id),label;
  if(S.mission.item){
    var it=(S.d.lists[s.id]||[]).filter(function(i){return i.id===S.mission.item})[0];

  var go=btn(null,S.mission.item?"완료 표시":"진행 시작",function(){

  var other=btn("sub","다른 항목",function(){

    for(var i=0;i<8&&S.mission&&cur&&same(S.mission,cur);i++)pickMission();

/* 메모가 없을 때 데이터로 짐작한 힌트 */
function autoHint(s){
  if(s.type==="grid"){
    var ld=lastCheck(s);if(ld)return "마지막 체크한 날 · "+fmtUp(ld);
    var last="";cellsOf(s).forEach(function(k){if(st(S.d,s,k)===2&&k>last)last=k});

  if(s.type==="list"){var L=S.d.lists[s.id]||[];return L.length?"체크리스트 "+L.filter(function(i){return i.done}).length+"/"+L.length+"개 완료":""}

  var O=sAdd(svg,"g",{filter:"url(#wob)",fill:"none","stroke-linejoin":"round","stroke-linecap":"round"});
  if(!geo){
    sAdd(O,"path",{d:BOTTLE,fill:"url(#glassG)",style:"stroke:var(--ink)","stroke-opacity":".55","stroke-width":"2"});
    sAdd(O,"path",{d:"M196 150 C182 172 180 200 192 226",stroke:"#fff","stroke-opacity":md.hlOp,"stroke-width":"4"});
    sAdd(O,"path",{d:"M410 160 C422 180 422 206 412 228",stroke:"#fff","stroke-opacity":".5","stroke-width":"3"});
    sAdd(O,"rect",{x:"252",y:"56",width:"96",height:"16",rx:"7",fill:"#ffffff","fill-opacity":".35",style:"stroke:var(--ink)","stroke-opacity":".5","stroke-width":"2"});
    sAdd(O,"path",{d:"M268 58 L270 24 Q300 16 330 24 L332 58 Z",fill:"#c9a06a",stroke:"#8a6a3f","stroke-opacity":".8","stroke-width":"1.6"});
    [32,40,48].forEach(function(y){sAdd(O,"path",{d:"M274 "+y+" Q300 "+(y-3)+" 326 "+y,stroke:"#8a6a3f","stroke-opacity":".45","stroke-width":"1"})});
  }else{
    sAdd(O,"polygon",{points:GEO_POLY,fill:"url(#glassG)",style:"stroke:var(--ink)","stroke-opacity":".8","stroke-width":"2"});
    var Q=[[214,118],[318,104],[372,168],[322,248],[232,234]];
    sAdd(O,"polygon",{points:Q.map(function(q){return q.join(",")}).join(" "),style:"stroke:var(--ink)","stroke-opacity":".75","stroke-width":"2"});
    [[0,[168,100]],[0,[250,56]],[1,[352,70]],[2,[432,122]],[2,[410,226]],[3,[330,268]],[4,[232,262]],[4,[172,206]]].forEach(function(c){sAdd(O,"line",{x1:Q[c[0]][0],y1:Q[c[0]][1],x2:c[1][0],y2:c[1][1],style:"stroke:var(--ink)","stroke-opacity":".7","stroke-width":"1.8"})});
    sAdd(O,"path",{d:"M186 130 L226 100",stroke:"#fff","stroke-opacity":md.hlOp,"stroke-width":"4"});
  }
}
function terrariumSvg(x,lv,g){
  var geo=S.tstyle==="geo",md=seoulMood();
  var svg=sEl("svg",{viewBox:"0 0 600 310","class":"terrarium-svg",role:"img","aria-label":"일러스트 테라리움"});
  svgDefs(svg,geo);
  svgBackdrop(svg,md);
  var clipG=sAdd(svg,"g",{"clip-path":"url(#inn)"}),G=sAdd(clipG,"g",{filter:"url(#wob)"});
  svgContents(G,LAYOUT[geo?"geo":"bottle"],lv);
  sAdd(clipG,"rect",{x:"100",y:"20",width:"400",height:"290",fill:md.tint,"fill-opacity":md.tintOp,"pointer-events":"none"}); /* 병 안 색조 */
  svgGlass(svg,geo,md);
  var ach=ACH.filter(function(a){return a[4](g)}).length;
  var pillG=sAdd(svg,"g",{transform:"translate(432,20)"});
  sAdd(pillG,"rect",{x:"0",y:"0",width:"148",height:"26",rx:"13",style:"fill:var(--card)","fill-opacity":".9"});
  var txt=sAdd(pillG,"text",{x:"74",y:"17","text-anchor":"middle","font-size":"11","font-weight":"600",style:"fill:var(--sub)"});
  txt.textContent="마일스톤 "+ach+"/"+ACH.length+" · Lv."+lv;
  sAdd(svg,"rect",{x:"0",y:"0",width:"600",height:"310",rx:"18",filter:"url(#paper)",opacity:".16","pointer-events":"none"});
  return svg;
}

function renderGarden(){
  var G=$("garden");G.textContent="";
  var x=xp(),lv=lvOf(x),g=gstats(),md=seoulMood(),stage=stageOf(x),need=100-x%100;

  G.appendChild(add(el("div","ghead"),
    el("div","gt","테라리움 정원"),
    el("div","gs","정리를 이어갈수록 유리병 속 이끼와 수목이 자라고, 서울 시간에 맞춰 빛이 바뀌어요. 지금은 "+md.ico+" "+md.label+".")));

  var box=el("div","terrarium-stage");
  var styles=[{id:"bottle",label:"🫙 유리병"},{id:"geo",label:"💎 다면체"}];
  var tcs=chipRow("chips",styles,function(c){return S.tstyle===c.id},function(c){S.tstyle=c.id;save();render()});
  tcs.style.marginBottom="12px";
  box.appendChild(tcs);
  var svgN=terrariumSvg(x,lv,g);
  /* 테라리움을 누르면 한 줄씩 상태 이야기 */
  var lines=[md.ico+" "+md.label+" · "+md.note,"누적 "+x+" XP · 다음 레벨까지 "+need+" XP","현재 "+stage+" 단계예요. 오늘도 한 칸씩!"];
  svgN.onclick=function(){say(lines[S.gTap%lines.length]);S.gTap++};
  box.appendChild(svgN);
  var cap=el("div","terrarium-caption");
  cap.innerHTML="<span>현재 생태 단계 · <strong>"+stage+"</strong></span><span>Lv."+lv+" · "+ttl(lv)+"</span>";
  box.appendChild(cap);
  var nx=ENV_ITEMS.filter(function(it){return lv<it.lv})[0];
  box.appendChild(el("div","next-unlock",nx?"다음 해금 · "+nx.ico+" "+nx.name+" (Lv."+nx.lv+") · "+need+" XP 더 모으면 레벨업":"모든 생태 요소가 자랐어요 🌿"));
  G.appendChild(box);

  /* 레벨 카드 */
  var lc=el("div","gcard"),t1=el("div","t1");
  t1.style.cssText="display:flex;justify-content:space-between;align-items:baseline;font-size:17px;font-weight:700;letter-spacing:-0.02em";
  lc.appendChild(add(t1,el("span",null,"Lv."+lv+" · "+ttl(lv)),el("span",null,"다음 레벨까지 "+need+" XP")));
  lc.appendChild(bar(x%100));
  var gs=el("div","gs4");
  [[x,"경험치"],[g.cells+g.items+g.removed,"정리 완료"],[streak(),"현재 연속"],[bestStreak(),"최고 연속"]].forEach(function(a){
    gs.appendChild(add(el("div"),el("b",null,String(a[0])),el("span",null,a[1])));
  });
  lc.appendChild(gs);
  G.appendChild(lc);

  /* 생태 요소 */
  var ec=el("div","gcard"),eGrid=el("div","env-grid");
  ec.appendChild(el("h3",null,"생태 요소 성장"));
  ENV_ITEMS.forEach(function(item){
    var ok=lv>=item.lv;
    eGrid.appendChild(add(el("div","env-item"+(ok?"":" lock")),el("div","ico",item.ico),el("b",null,item.name),el("span",null,ok?item.desc:"Lv."+item.lv+" 해금")));
  });
  ec.appendChild(eGrid);
  G.appendChild(ec);

  /* 마일스톤 */
  var ac=el("div","gcard"),ag=el("div","ag");
  ac.appendChild(el("h3",null,"정리 마일스톤"));
  ACH.forEach(function(a){
    var ok=a[4](g);
    ag.appendChild(add(el("div","ac"+(ok?" ok":" lock")),el("div","ae",a[1]),add(el("div"),el("b",null,a[2]),el("span",null,ok?"달성 완료":a[3]))));
  });
  ac.appendChild(ag);
  G.appendChild(ac);
}

/* ==========================================================================
   11. 설정 패널
   ========================================================================== */
/* data-속성 칩들 중 현재 값만 켜기 */
function markChips(attr,isOn){document.querySelectorAll("["+attr+"]").forEach(function(b){b.className="chip"+(isOn(b)?" on":"")})}
function applyZoom(){
  var c=document.querySelector(".card");if(c)c.style.zoom=S.zoom;
  markChips("data-z",function(b){return +b.dataset.z===S.zoom});
}
var FONTS={
  noto:{body:"'Inter','Noto Sans KR','Gowun Dodum',sans-serif",title:"'Inter','Noto Sans KR','Gowun Dodum',sans-serif"},
  jua:{body:"'Noto Sans KR','Gowun Dodum',sans-serif",title:"'Jua','Noto Sans KR',sans-serif"},
  gowun:{body:"'Gowun Dodum','Noto Sans KR',sans-serif",title:"'Gowun Dodum','Noto Sans KR',sans-serif"}
};
function applyFont(){
  var f=FONTS[S.font]||FONTS.noto,root=document.documentElement.style;
  root.setProperty("--body",f.body);root.setProperty("--title",f.title);
  markChips("data-f",function(b){return b.dataset.f===S.font});
}
function applyDensity(){
  document.body.classList.toggle("compact",S.density==="compact");
  markChips("data-d",function(b){return b.dataset.d===S.density});
}
function applyCalm(){
  document.body.classList.toggle("calm-embed",!!S.calmEmbed);
  var b=$("bCalm");b.className="chip"+(S.calmEmbed?" on":"");b.textContent=S.calmEmbed?"✓ 그림자·장식 줄이는 중":"그림자·장식 줄이기";
}
function toggleTheme(){
  S.theme=isDark()?"light":"dark";
  document.documentElement.setAttribute("data-theme",S.theme);
  save();
}

/* --- JSON 백업 · 복원 --- */
function syncArmed(){$("bJsonRestore").textContent=S.armed==="restore"?"정말 복원할까요? 한 번 더 누르기":"붙여넣기로 복원"}
function backupText(){return JSON.stringify(S.d,null,2)}
function copyBackup(){
  var t=backupText(),box=$("jsonBox");box.value=t;
  function fallback(){try{box.focus();box.select();if(document.execCommand("copy")){say("JSON을 복사했어요");return}}catch(e){}say("아래 상자에서 직접 복사해 주세요")}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){say("JSON을 복사했어요")},fallback);return}}catch(e){}
  fallback();
}
function downloadBackup(){
  var t=backupText();$("jsonBox").value=t;
  try{
    var u=URL.createObjectURL(new Blob([t],{type:"application/json;charset=utf-8"})),a=document.createElement("a");
    a.href=u;a.download="clean-quest-"+today()+".json";document.body.appendChild(a);a.click();
    setTimeout(function(){a.remove();URL.revokeObjectURL(u)},500);
    say("JSON 파일을 저장했어요 (노션 안에서는 막힐 수 있어요 → 그땐 'JSON 복사')");
  }catch(e){say("여기서는 파일 저장이 안 돼요. 'JSON 복사'를 써 주세요")}
}
function checkBackup(o){
  var t=o&&o.d&&typeof o.d==="object"?o.d:o;
  if(!t||typeof t!=="object"||!Array.isArray(t.sources)||!t.sources.length)return {ok:false,why:"정리 대상(sources)이 들어 있는 Clean Quest JSON이 아니에요"};
  for(var i=0;i<t.sources.length;i++){var s=t.sources[i];if(!s||!s.id||typeof s.name!=="string"||!s.name.trim())return {ok:false,why:"이름이나 id가 빠진 대상이 있어요"}}
  return {ok:true,d:norm(clone(t))};
}
/* 두 번 눌러야 복원, 복원 후에도 '실행 취소' 가능 */
function restoreBackup(){
  var v=$("jsonBox").value.trim();
  if(!v){say("복원할 JSON을 상자에 붙여넣어 주세요");return}
  var c;try{c=checkBackup(JSON.parse(v))}catch(e){say("JSON 형식이 올바르지 않아요");return}
  if(!c.ok){say(c.why);return}
  if(S.armed!=="restore"){S.armed="restore";syncArmed();say("지금 데이터가 이 JSON으로 바뀌어요. 한 번 더 누르면 복원돼요");return}
  S.armed=null;syncArmed();
  S.mission=null;S.focusSrc="all";S.collapsed={};
  var data=c.d;
  op(function(){return clone(data)},{msg:"JSON에서 복원했어요"});
}

/* --- GitHub 연결 --- */
function saveGithub(){
  CFG={user:cleanName($("gu").value),repo:cleanName($("gr").value),token:cleanTok($("gt").value)};
  $("gu").value=CFG.user;$("gr").value=CFG.repo;$("gt").value=CFG.token;
  saveCfg();
  if(!synced()){setDot("off");say("GitHub 아이디, 저장소, 토큰을 모두 입력해 주세요");return}
  op(function(d){return d});   /* 빈 작업 → 원격 최신본을 받아 병합 */
  $("cfg").classList.remove("show");
}
function logoutGithub(){
  CFG={user:"",repo:"",token:""};
  saveCfg();
  $("gu").value=$("gr").value=$("gt").value="";
  setDot("off");
  say("이 기기에서 GitHub 연결을 해제했습니다");
}

/* --- 버튼 연결 (한 곳에서) --- */
function bindUI(){
  $("tG").onclick=function(){setTab("garden")};
  $("tC").onclick=function(){setTab("clean")};
  $("tL").onclick=function(){setTab("log")};
  $("bCfg").onclick=function(){
    $("gu").value=CFG.user;$("gr").value=CFG.repo;$("gt").value=CFG.token;
    $("cfg").classList.toggle("show");
    S.armed=null;syncArmed();
  };
  $("gshow").onclick=function(){var i=$("gt");i.type=i.type==="password"?"text":"password"};
  $("gsave").onclick=saveGithub;
  $("gout").onclick=logoutGithub;
  $("gtheme").onclick=toggleTheme;
  $("qTheme").onclick=toggleTheme;
  document.querySelectorAll("[data-z]").forEach(function(b){b.onclick=function(){S.zoom=+b.dataset.z;save();applyZoom()}});
  document.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){S.font=b.dataset.f;save();applyFont()}});
  document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){S.density=b.dataset.d;save();applyDensity()}});
  $("bCalm").onclick=function(){S.calmEmbed=!S.calmEmbed;save();applyCalm()};
  $("bJsonCopy").onclick=copyBackup;
  $("bJsonDown").onclick=downloadBackup;
  $("bJsonRestore").onclick=restoreBackup;
}

/* ==========================================================================
   12. 시작
   ========================================================================== */
/* 자정이 지나면 날짜를, 서울 시각의 '시'가 바뀌면 테라리움 빛을 다시 그림 */
var lastDay=today(),lastHour=seoulHour();
function refreshDate(){NOW=new Date();CY=NOW.getFullYear();CM=NOW.getMonth()+1}
function tickDate(){var t=today(),h=seoulHour();if(t!==lastDay){lastDay=t;refreshDate();render()}else if(h!==lastHour){lastHour=h;render()}lastHour=h}

function init(){
  loadState();
  loadCfg();
  if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);
  S.ws=sundayOf(new Date());
  bindUI();
  applyZoom();
  applyFont();
  applyDensity();
  applyCalm();
  setInterval(tickDate,60000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden){tickDate();pull()}});
  render();
  renderStamp();
  pull();
}
init();
</script>
