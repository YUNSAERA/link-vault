<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Clean Quest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jua&family=Noto+Sans+KR:wght@400;500;600;700&family=Gowun+Dodum&display=swap">
<style>
/* ==========================================================================
   Design Tokens (2026 Minimal Surface + Neutral Slate + Single Accent)
   ========================================================================== */
:root{
  --body:'Inter','Noto Sans KR','Gowun Dodum',sans-serif;
  --title:'Inter','Noto Sans KR','Gowun Dodum',sans-serif;
  --page:#f5f6f8;
  --card:#ffffff;
  --ink:#18181b;
  --sub:#5c5c66;
  --muted:#767680;
  --field:#f4f4f5;
  --line:rgba(24,24,27,0.06);
  --accent:#0f766e;
  --accent-soft:rgba(15,118,110,0.09);
  --accent-border:rgba(15,118,110,0.22);
  --item:#fafafa;
  --chip:#f4f4f5;
  --shadow-sm:0 1px 2px rgba(24,24,27,0.03),0 4px 16px -4px rgba(24,24,27,0.05);
  --shadow-md:0 12px 32px -12px rgba(24,24,27,0.08),0 2px 6px -1px rgba(24,24,27,0.04);
  --sky1:#eef2f6;
  --sky2:#fafaf9;
  --fill1:#0f766e;
  --fill2:#14b8a6;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0b0c0e;
    --card:#121417;
    --ink:#f4f4f5;
    --sub:#b6b6c0;
    --muted:#9a9aa4;
    --field:#1b1e23;
    --line:rgba(255,255,255,0.07);
    --accent:#2dd4bf;
    --accent-soft:rgba(45,212,191,0.11);
    --accent-border:rgba(45,212,191,0.24);
    --item:#171a1e;
    --chip:#1d2127;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35),0 8px 24px -8px rgba(0,0,0,0.45);
    --shadow-md:0 16px 40px -14px rgba(0,0,0,0.6),0 4px 12px -2px rgba(0,0,0,0.35);
    --sky1:#151921;
    --sky2:#111317;
    --fill1:#2dd4bf;
    --fill2:#0d9488;
  }
}

:root[data-theme="dark"]{
  --page:#0b0c0e;
  --card:#121417;
  --ink:#f4f4f5;
  --sub:#b6b6c0;
  --muted:#9a9aa4;
  --field:#1b1e23;
  --line:rgba(255,255,255,0.07);
  --accent:#2dd4bf;
  --accent-soft:rgba(45,212,191,0.11);
  --accent-border:rgba(45,212,191,0.24);
  --item:#171a1e;
  --chip:#1d2127;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.35),0 8px 24px -8px rgba(0,0,0,0.45);
  --shadow-md:0 16px 40px -14px rgba(0,0,0,0.6),0 4px 12px -2px rgba(0,0,0,0.35);
  --sky1:#151921;
  --sky2:#111317;
  --fill1:#2dd4bf;
  --fill2:#0d9488;
}

*{box-sizing:border-box}
[hidden]{display:none!important}

html,body{
  margin:0;
  padding:0;
  background:var(--page);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.6;
  letter-spacing:-0.011em;
  -webkit-font-smoothing:antialiased;
}

body{
  min-height:100dvh;
  padding:28px 16px 48px;
}

/* Main Minimal Container */
.card{
  max-width:640px;
  margin:0 auto;
  padding:32px;
  background:var(--card);
  border-radius:28px;
  box-shadow:var(--shadow-md);
}

/* Header & Typography Hierarchy */
.head{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:24px;
}
.head .mark{
  width:40px;
  height:40px;
  border-radius:14px;
  background:var(--accent-soft);
  color:var(--accent);
  display:grid;
  place-items:center;
  font-size:19px;
  flex:none;
}
.head h1{
  font-family:var(--title);
  font-size:22px;
  font-weight:700;
  line-height:1.25;
  letter-spacing:-0.025em;
  margin:0;
  flex:1;
}
.badge{
  background:var(--accent-soft);
  color:var(--accent);
  font-family:var(--body);
  font-weight:600;
  font-size:12px;
  letter-spacing:0.02em;
  padding:6px 12px;
  border-radius:999px;
}

/* Inputs & Controls */
input,textarea{
  width:100%;
  border:1px solid transparent;
  background:var(--field);
  color:var(--ink);
  border-radius:14px;
  padding:13px 16px;
  font:400 15px/1.5 var(--body);
  letter-spacing:-0.01em;
  outline:none;
  transition:background-color .2s ease,box-shadow .2s ease,border-color .2s ease;
}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus,textarea:focus{
  background:var(--card);
  border-color:var(--accent-border);
  box-shadow:0 0 0 4px var(--accent-soft);
}

button{
  font-family:var(--body);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:transform .16s cubic-bezier(.22,1,.36,1),background-color .2s ease,color .2s ease,box-shadow .2s ease,opacity .2s ease;
}
button:not(:disabled):hover{opacity:0.92}
button:not(:disabled):active{transform:scale(0.97)}
button:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

.row{display:flex;gap:12px;margin-top:14px}
.row .add{flex:none}
.add{
  background:var(--accent);
  color:#ffffff;
  border:0;
  border-radius:14px;
  font-weight:600;
  font-size:14px;
  letter-spacing:-0.01em;
  padding:12px 20px;
  white-space:nowrap;
  box-shadow:0 4px 14px -4px var(--accent-border);
}
:root[data-theme="dark"] .add{color:#0b1110}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .add{color:#0b1110}
}

/* Segmented Navigation Tabs */
.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  padding:5px;
  background:var(--field);
  border-radius:16px;
  margin:0 0 24px;
}
.tab{
  border:0;
  background:transparent;
  color:var(--sub);
  font-weight:600;
  font-size:14px;
  letter-spacing:-0.01em;
  padding:10px 12px;
  border-radius:12px;
}
.tab.on{
  background:var(--card);
  color:var(--ink);
  box-shadow:var(--shadow-sm);
}

/* Chips & Filter Pills */
.chips{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.chip{
  height:34px;
  padding:0 14px;
  border-radius:999px;
  border:0;
  background:var(--chip);
  color:var(--sub);
  font-weight:500;
  font-size:13px;
  letter-spacing:-0.01em;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.chip.on{
  background:var(--accent);
  color:#ffffff;
  font-weight:600;
}
:root[data-theme="dark"] .chip.on{color:#0b1110}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .chip.on{color:#0b1110}
}

/* Hero Overview Card */
.hero{
  background:var(--item);
  border-radius:22px;
  padding:22px 24px;
  margin-bottom:24px;
  box-shadow:var(--shadow-sm);
}
.hero .t1{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:12px;
  font-size:17px;
  font-weight:700;
  letter-spacing:-0.02em;
}
.hero .t1 span:last-child{
  font-size:14px;
  font-weight:600;
  color:var(--accent);
}
.hero .t2{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  color:var(--sub);
  margin-top:10px;
}

/* Progress Bar */
.bar{
  height:8px;
  border-radius:999px;
  background:var(--field);
  overflow:hidden;
  margin-top:12px;
}
.bar>i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--fill1),var(--fill2));
  border-radius:999px;
  transition:width .55s cubic-bezier(.22,1,.36,1);
  min-width:0;
}

.strip{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid var(--line);
  font-size:13px;
  font-weight:500;
  color:var(--sub);
  cursor:pointer;
}
.strip .go{
  margin-left:auto;
  font-size:12px;
  font-weight:600;
  color:var(--accent);
  letter-spacing:-0.01em;
}

/* Daily Mission Card */
.mission{
  background:var(--item);
  border-radius:22px;
  padding:22px 24px;
  margin-bottom:24px;
  box-shadow:var(--shadow-sm);
}
.mission-kicker{
  font-size:11px;
  font-weight:600;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:6px;
}
.mission-title{
  font-size:16px;
  font-weight:600;
  letter-spacing:-0.015em;
  color:var(--ink);
}
.mrow,.ybtns{
  display:flex;
  gap:10px;
  margin-top:16px;
  flex-wrap:wrap;
}
.mrow button,.ybtns button{
  border:0;
  border-radius:12px;
  background:var(--accent);
  color:#ffffff;
  font-weight:600;
  font-size:13px;
  padding:10px 16px;
  white-space:nowrap;
}
:root[data-theme="dark"] .mrow button,:root[data-theme="dark"] .ybtns button{color:#0b1110}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .mrow button,:root:not([data-theme="light"]) .ybtns button{color:#0b1110}
}
.mrow .sub,.ybtns .sub{
  background:var(--chip);
  color:var(--sub);
}

/* Where I left off summary */
.upto{background:var(--item);border-radius:22px;padding:20px 24px;margin-bottom:24px;box-shadow:var(--shadow-sm)}
.upr{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.upr:last-child{border-bottom:0;padding-bottom:0}
.upn{font-weight:600;font-size:14px;flex:0 0 40%;letter-spacing:-0.01em}
.upt{font-size:13px;color:var(--ink);flex:1;line-height:1.5;word-break:break-word}
.upt small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.upt.none{color:var(--muted)}
.upgo{color:var(--accent);font-weight:600;font-size:12px;flex:none;align-self:center}
.qk{display:flex;gap:8px;flex-wrap:wrap}

.uph{display:flex;align-items:center;gap:12px;cursor:pointer}
.uph>div{flex:1;min-width:0}
.uparrow{color:var(--muted);font-size:16px;flex:none}
.upsum{font-size:13px;color:var(--sub);margin-top:4px}
.upr:first-of-type{margin-top:8px}

/* Day-level check */
.dpanel{margin-top:14px;padding:16px;background:var(--card);border-radius:16px;box-shadow:var(--shadow-sm)}
.dsel{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.dsel select{border:1px solid transparent;background:var(--field);color:var(--ink);border-radius:12px;padding:9px 12px;font:500 14px var(--body)}
.dcal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dh{text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.dd{aspect-ratio:1;border:0;border-radius:9px;background:var(--field);color:var(--sub);font:500 13px var(--body);padding:0;min-width:0}
.dd.s2{background:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .dd.s2{color:#0b1110}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dd.s2{color:#0b1110}}
.dd.s3{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.dd.blank{background:transparent;cursor:default}
.dd.fut{opacity:.28;cursor:default}
.dd.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.dd:not(.fut):not(.blank):hover{transform:scale(1.08)}
.dfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:12px}
.dbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* Source Cards */
.src{
  background:var(--item);
  border-radius:22px;
  padding:22px 24px;
  margin-bottom:20px;
  box-shadow:var(--shadow-sm);
}
.sh{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:600;
  font-size:16px;
  letter-spacing:-0.015em;
}
.sh small{
  margin-left:auto;
  color:var(--accent);
  font-size:14px;
  font-weight:700;
}
.dots{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:18px;
  padding:4px 8px;
  border-radius:10px;
}
.dots:hover{background:var(--chip);color:var(--ink)}

/* Monthly Grid */
.gr{
  display:grid;
  grid-template-columns:36px repeat(12,1fr);
  gap:5px;
  margin-top:18px;
  align-items:center;
}
.gr .yl{
  font-weight:600;
  color:var(--sub);
  font-size:11px;
  letter-spacing:0.01em;
}
.gr .mh{
  text-align:center;
  font-size:11px;
  font-weight:500;
  color:var(--muted);
}
.c{
  aspect-ratio:1;
  border-radius:8px;
  border:0;
  background:var(--field);
  color:var(--sub);
  font-weight:500;
  font-size:11px;
  padding:0;
  min-width:0;
}
.c:not(.fut):hover{transform:scale(1.08)}
.c.s1{background:#f59e0b;color:#ffffff;font-weight:600}
.c.s2{background:var(--accent);color:#ffffff;font-weight:600}
:root[data-theme="dark"] .c.s2{color:#0b1110}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .c.s2{color:#0b1110}
}
.c.s3{
  background:transparent;
  box-shadow:inset 0 0 0 1px var(--line);
  color:var(--muted);
}
.c.fut{opacity:0.28;cursor:default}

.leg{
  display:flex;
  gap:14px;
  font-size:12px;
  color:var(--sub);
  margin-top:16px;
  flex-wrap:wrap;
  align-items:center;
}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:3px;
  background:var(--field);
}

/* Counter & List */
.cnt{
  font-family:var(--title);
  font-weight:700;
  font-size:34px;
  letter-spacing:-0.03em;
  text-align:center;
  margin:18px 0 4px;
}
.cnt small{
  font-family:var(--body);
  font-weight:400;
  font-size:13px;
  color:var(--sub);
  letter-spacing:-0.01em;
}
.tip{
  font-size:13px;
  color:var(--sub);
  margin-top:10px;
  line-height:1.55;
}
.cnt + .ybtns + .tip{text-align:center}

.li{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid var(--line);
  font-size:15px;
}
.li:last-of-type{border-bottom:0}
.li span{flex:1;word-break:break-word}
.li.done span{text-decoration:line-through;color:var(--muted)}
.ck{
  width:24px;
  height:24px;
  border-radius:8px;
  border:1.5px solid var(--accent);
  background:transparent;
  color:#ffffff;
  font-size:13px;
  padding:0;
  flex:none;
  display:grid;
  place-items:center;
}
.ck.on{background:var(--accent)}
:root[data-theme="dark"] .ck.on{color:#0b1110}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .ck.on{color:#0b1110}
}
.rb{
  width:28px;
  height:28px;
  border-radius:999px;
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:13px;
  display:grid;
  place-items:center;
  flex:none;
}
.rb:hover{background:var(--field);color:var(--ink)}

.mini{display:flex;gap:10px;margin-top:14px}
.mini input{padding:10px 14px;font-size:14px}
.mini button,.ed button{
  border:0;
  border-radius:12px;
  background:var(--accent);
  color:#ffffff;
  font-weight:600;
  font-size:13px;
  padding:10px 16px;
  flex:none;
  white-space:nowrap;
}
:root[data-theme="dark"] .mini button,:root[data-theme="dark"] .ed button{color:#0b1110}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .mini button,:root:not([data-theme="light"]) .ed button{color:#0b1110}
}

.ed{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap}
.ed input{padding:10px 14px;font-size:14px}
.ed .sub{background:var(--chip);color:var(--sub)}
.ed .danger{background:rgba(220,38,38,0.1);color:#dc2626}
:root[data-theme="dark"] .ed .danger{background:rgba(248,113,113,0.14);color:#fca5a5}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .ed .danger{background:rgba(248,113,113,0.14);color:#fca5a5}
}

/* Progress Checkpoint Row */
.up{margin-top:14px}
.up .line{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--field);
  border-radius:12px;
  padding:10px 14px;
  font-size:13px;
  color:var(--ink);
}
.up .line span{flex:1;word-break:break-word}
.up .line small{color:var(--muted);font-size:11px}
.up .ef{
  display:flex;
  flex-direction:column;
  gap:10px;
  background:var(--card);
  padding:14px;
  border-radius:16px;
  box-shadow:var(--shadow-sm);
}
.up .ef .mini{margin-top:2px}

/* Emoji Palette & Add Source */
.pal{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pe{
  width:38px;
  height:38px;
  border-radius:10px;
  border:0;
  background:var(--field);
  font-size:18px;
  padding:0;
}
.pe.on{
  background:var(--accent-soft);
  box-shadow:inset 0 0 0 1.5px var(--accent);
}
.emi{width:68px;flex:none;text-align:center;font-size:20px;padding:9px}
.erow{display:flex;align-items:center;gap:12px;margin-top:12px}

.addbox{
  background:var(--item);
  border-radius:22px;
  padding:20px 24px;
  margin-top:20px;
  box-shadow:var(--shadow-sm);
}

/* Log / Calendar / GitHub Contribution Matrix */
.lnav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:8px 0 18px;
}
.lnav span{
  font-size:17px;
  font-weight:700;
  letter-spacing:-0.02em;
}
.lnav button{
  width:36px;
  height:36px;
  border-radius:999px;
  border:0;
  background:var(--field);
  color:var(--ink);
  font-size:14px;
  display:grid;
  place-items:center;
}

.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.mcard{
  background:var(--item);
  border-radius:20px;
  padding:18px;
  min-width:0;
  box-shadow:var(--shadow-sm);
}
.mcard .mt{
  font-weight:600;
  font-size:14px;
  letter-spacing:-0.01em;
  margin-bottom:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dc{
  aspect-ratio:1;
  border:0;
  border-radius:7px;
  background:var(--field);
  color:var(--sub);
  font-weight:500;
  font-size:11px;
  padding:0;
  min-width:0;
}
.dc:not(.fut):not(.blank):hover{transform:scale(1.1)}
.dc.blank{background:transparent;cursor:default;color:var(--muted);opacity:0.45}
.dc.on{background:var(--accent);color:#ffffff;font-weight:600}
:root[data-theme="dark"] .dc.on{color:#0b1110}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .dc.on{color:#0b1110}
}
.dc.rest{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dc.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.dc.fut{opacity:0.28;cursor:default}
.mf{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  font-weight:600;
  color:var(--sub);
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid var(--line);
}

.wk{
  display:grid;
  grid-template-columns:116px repeat(7,minmax(0,1fr));
  gap:6px;
  align-items:center;
  margin-top:16px;
}
.wk .wl{
  font-size:13px;

<script>
var KEY="cleanquest:v1",CKEY="homevault:cfg",PATH="cleanup.json";
var NOW=new Date(),CY=NOW.getFullYear(),CM=NOW.getMonth()+1;
var TITLES=["이끼 씨앗","돌길 정원사","숲길 관리자","개울 설계자","생태 큐레이터","정원 마스터"];
var CFG={user:"",repo:"",token:""};
var S={d:null,mission:null,tab:"clean",lv:"green",cat:"all",my:CY,mm:CM,ws:null,theme:"",ed:{},del:null,addOpen:false,nt:"list",zoom:1,up:{},font:"noto",shown:null,tstyle:"bottle",uptoOpen:false,dv:{}};

function $(id){return document.getElementById(id)}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function pad(n){return n<10?"0"+n:""+n}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){var t=new Date();return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())}

function seed(){return{sources:[
  {id:"kakao",name:"카카오톡 나에게 보내기",emoji:"💬",type:"grid",from:2020},
  {id:"yt",name:"유튜브 나중에 볼 영상",emoji:"▶️",type:"count"},
  {id:"g26",name:"S26 갤러리",emoji:"📱",type:"grid",from:2024},
  {id:"g22",name:"S22 갤러리",emoji:"📱",type:"grid",from:2022},
  {id:"hdd",name:"외장하드 1",emoji:"💾",type:"list"}],grid:{},counts:{},lists:{},act:{},marks:{},log:{},days:{}}}

function norm(d){
  d=d||{};
  if(!Array.isArray(d.sources)||!d.sources.length)d.sources=seed().sources;
  d.grid=d.grid||{};d.counts=d.counts||{};d.lists=d.lists||{};
  d.act=d.act||{};d.marks=d.marks||{};d.log=d.log||{};d.days=d.days||{};
  return d;
}

S.d=seed();
try{
  var raw=localStorage.getItem(KEY);
  if(raw){
    var p=JSON.parse(raw);
    if(p&&p.d)S.d=norm(p.d);
    if(p&&p.theme)S.theme=p.theme;
    if(p&&p.zoom)S.zoom=p.zoom;
    if(p&&p.font)S.font=p.font;
    if(p&&p.shown!=null)S.shown=p.shown;
    if(p&&p.tstyle)S.tstyle=p.tstyle;
    if(p&&p.uptoOpen!=null)S.uptoOpen=p.uptoOpen;
  }
}catch(e){}

try{
  var c=localStorage.getItem(CKEY);
  if(c){
    var q0=JSON.parse(c);
    if(q0)CFG={user:q0.user||"",repo:q0.repo||"",token:q0.token||""};
  }
}catch(e){}

function cleanTok(t){t=String(t||"");var m=t.match(/(github_pat_|ghp_|gho_|ghu_|ghs_|ghr_)[A-Za-z0-9_]+/);return m?m[0]:t.replace(/[^\x21-\x7e]/g,"")}
function cleanName(t){return String(t||"").replace(/[^A-Za-z0-9._-]/g,"")}
CFG.token=cleanTok(CFG.token);CFG.user=cleanName(CFG.user);CFG.repo=cleanName(CFG.repo);
if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);

function save(){
  try{localStorage.setItem(KEY,JSON.stringify({d:S.d,theme:S.theme,zoom:S.zoom,font:S.font,shown:S.shown,tstyle:S.tstyle,uptoOpen:S.uptoOpen}))}catch(e){}
}
function saveCfg(){
  try{localStorage.setItem(CKEY,JSON.stringify(CFG))}catch(e){}
}

var msgTimer=null;
function say(m){
  $("msg").textContent=m;
  clearTimeout(msgTimer);
  msgTimer=setTimeout(function(){$("msg").textContent=""},5000);
}
function synced(){return !!(CFG.user&&CFG.repo&&CFG.token)}
function setDot(k){$("dot").className=k}
function enc(t){return btoa(unescape(encodeURIComponent(t)))}
function dec(b){return decodeURIComponent(escape(atob(b.replace(/\n/g,""))))}
function url(get){return "https://api.github.com/repos/"+encodeURIComponent(CFG.user)+"/"+encodeURIComponent(CFG.repo)+"/contents/"+PATH+(get?"?t="+Date.now():"")}
function hdr(){return{"Authorization":"Bearer "+CFG.token,"Accept":"application/vnd.github+json"}}

function errText(e){
  var m=e&&e.message||"";
  if(m==="401")return "토큰이 거부됐어요. 길이 "+CFG.token.length+" (보통 93), 끝 ..."+CFG.token.slice(-4);
  if(m==="403")return "권한 없음: 토큰의 Contents를 Read and write로 해주세요";
  if(m==="404")return "아이디 또는 저장소 이름을 확인해 주세요";
  return "동기화 실패 ("+(m||"network")+")";
}

async function remoteGet(){
  var r=await fetch(url(true),{headers:hdr(),cache:"no-store"});
  if(r.status===404)return{d:null,sha:null};
  if(!r.ok)throw new Error(String(r.status));
  var j=await r.json();
  return{d:norm(JSON.parse(dec(j.content))),sha:j.sha};
}

async function remoteApply(fn,tries){
  var g=await remoteGet();
  var out=fn(g.d||JSON.parse(JSON.stringify(S.d)));
  var body={message:"Update cleanup progress",content:enc(JSON.stringify(out,null,1))};
  if(g.sha)body.sha=g.sha;
  var r=await fetch(url(false),{method:"PUT",headers:hdr(),body:JSON.stringify(body)});
  if((r.status===409||r.status===422)&&tries<2)return remoteApply(fn,tries+1);
  if(!r.ok)throw new Error(String(r.status));
  return out;
}

var chain=Promise.resolve();
function op(fn){
  S.d=fn(JSON.parse(JSON.stringify(S.d)));
  save();
  render();
  if(!synced())return;
  setDot("busy");
  chain=chain.then(function(){return remoteApply(fn,0)})
    .then(function(d){S.d=d;save();render();setDot("")})
    .catch(function(e){setDot("err");say(errText(e))});
}

function pull(){
  if(!synced()){setDot("off");return}
  setDot("busy");
  chain=chain.then(remoteGet)
    .then(function(g){if(g.d){S.d=g.d;save();render()}setDot("")})
    .catch(function(e){setDot("err");say(errText(e))});
}

/* stats */
function cellsOf(s){
  var a=[];
  for(var y=s.from;y<=CY;y++)for(var m=1;m<=12;m++){
    if(y===CY&&m>CM)break;
    a.push(y+"-"+pad(m));
  }
  return a;
}
function st(d,s,k){return ((d.grid[s.id]||{})[k])||0}
function pct(s,d){
  d=d||S.d;
  if(s.type==="count"){var c=d.counts[s.id];return c&&c.total?Math.round((c.total-c.left)/c.total*100):0}
  if(s.type==="list"){var L=d.lists[s.id]||[];return L.length?Math.round(L.filter(function(x){return x.done}).length/L.length*100):0}
  var rel=cellsOf(s).filter(function(k){return st(d,s,k)!==3});
  if(!rel.length)return 100;
  return Math.round(rel.filter(function(k){return st(d,s,k)===2}).length/rel.length*100);
}
function yearDone(d,s,y){
  var any=false;
  for(var m=1;m<=12;m++){
    if(y===CY&&m>CM)break;
    var v=st(d,s,y+"-"+pad(m));
    if(v===2)any=true;else if(v!==3)return false;
  }
  return any;
}
function xp(){
  var x=0;
  S.d.sources.forEach(function(s){
    if(s.type==="count"){var c=S.d.counts[s.id];if(c)x+=(c.total-c.left)*2}
    else if(s.type==="list"){(S.d.lists[s.id]||[]).forEach(function(i){if(i.done)x+=5})}
    else{cellsOf(s).forEach(function(k){var v=st(S.d,s,k);x+=v===2?10:v===1?3:v===3?1:0});var dm=(S.d.days||{})[s.id]||{};Object.keys(dm).forEach(function(k){if(dm[k]===2)x+=1})}
  });
  return x;
}
function ds(dt){return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate())}
function pdate(x){var p=x.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function actN(id,date){return ((S.d.act[id]||{})[date])||0}
function mark(id,date){return ((S.d.marks[id]||{})[date])||0}
function dstate(id,date){if(actN(id,date)>0||mark(id,date)===1)return 1;if(mark(id,date)===2)return 2;return 0}
function dayAny(date){if((S.d.log[date]||0)>0)return true;return S.d.sources.some(function(s){return dstate(s.id,date)===1})}
function dayCount(date){
  var n=0;
  S.d.sources.forEach(function(s){n+=actN(s.id,date)+(mark(s.id,date)===1?1:0)});
  return Math.max(n,S.d.log[date]||0);
}
function streak(){
  var n=0,t=new Date();
  if(!dayAny(ds(t)))t.setDate(t.getDate()-1);
  while(dayAny(ds(t))){n++;t.setDate(t.getDate()-1)}
  return n;
}
function bestStreak(){
  var keys={};
  Object.keys(S.d.log).forEach(function(k){keys[k]=1});
  Object.keys(S.d.act).forEach(function(i){Object.keys(S.d.act[i]).forEach(function(k){keys[k]=1})});
  Object.keys(S.d.marks).forEach(function(i){Object.keys(S.d.marks[i]).forEach(function(k){keys[k]=1})});
  var ks=Object.keys(keys).sort();
  if(!ks.length)return 0;
  var t=pdate(ks[0]),end=new Date(),best=0,run=0;
  while(ds(t)<=ds(end)){if(dayAny(ds(t))){run++;if(run>best)best=run}else run=0;t.setDate(t.getDate()+1)}
  return best;
}
function bump(d,id){var t=today();d.log[t]=(d.log[t]||0)+1;if(id){d.act[id]=d.act[id]||{};d.act[id][t]=(d.act[id][t]||0)+1}}

/* actions */
function burst(){
  var E=["✨","🌿","💧","🍃"];
  for(var i=0;i<18;i++){
    var f=el("span","fly",E[i%E.length]);
    f.style.left=Math.round(Math.random()*92)+"%";
    f.style.animationDelay=(Math.random()*0.5)+"s";
    document.body.appendChild(f);
    (function(x){setTimeout(function(){x.remove()},2400)})(f);
  }
}
function setCell(s,key,val){
  op(function(d){
    d.grid[s.id]=d.grid[s.id]||{};
    if(val)d.grid[s.id][key]=val;else delete d.grid[s.id][key];
    if(val===1||val===2)bump(d,s.id);
    return d;
  });
}
function cycle(s,key,y){
  var before=yearDone(S.d,s,y),was=pct(s);
  setCell(s,key,(st(S.d,s,key)+1)%4);
  if(!before&&yearDone(S.d,s,y)){burst();say(y+"년 "+s.name+" 정리를 마쳤어요.")}
  if(was<100&&pct(s)===100)say(s.name+" 정리를 모두 완료했어요.")}
function pickMission(){
  var cells=[],items=[];
  S.d.sources.forEach(function(s){
    if(s.type==="grid")cellsOf(s).forEach(function(k){if(st(S.d,s,k)===0)cells.push({id:s.id,key:k})});
    if(s.type==="list")(S.d.lists[s.id]||[]).forEach(function(i){if(!i.done)items.push({id:s.id,item:i.id})});
  });
  var pool=(items.length&&(!cells.length||Math.random()<0.4))?items:cells;
  S.mission=pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
}
function mValid(m){
  var s=srcById(m.id);if(!s)return false;
  if(m.item)return (S.d.lists[s.id]||[]).some(function(i){return i.id===m.item&&!i.done});
  return st(S.d,s,m.key)===0;
}
function srcById(id){return S.d.sources.filter(function(s){return s.id===id})[0]}
function setCount(s,n){op(function(d){d.counts[s.id]={total:n,left:n};return d})}
function chg(s,delta){
  var c=S.d.counts[s.id];if(!c)return;
  op(function(d){
    var x=d.counts[s.id]||{total:0,left:0};
    if(delta<0)x.left=Math.max(0,x.left+delta);else{x.left+=delta;x.total+=delta}
    d.counts[s.id]=x;
    if(delta<0)bump(d,s.id);
    return d;
  });
  if(delta<0&&S.d.counts[s.id].left===0){burst();say(s.name+" 항목을 모두 정리했어요.")}
}

function dgt(d,s,k){return (((d.days||{})[s.id])||{})[k]||0}
function lastCheck(s){var m=(S.d.days||{})[s.id]||{},last="";Object.keys(m).forEach(function(k){if(m[k]===2&&k>last)last=k});return last}
function monthSync(d,s,y,m){
  var dim=new Date(y,m,0).getDate(),key=y+"-"+pad(m),done=0,open=0,td=today();
  for(var i=1;i<=dim;i++){var dt=key+"-"+pad(i);if(dt>td)break;var v=dgt(d,s,dt);if(v===2)done++;else if(v!==3)open++}
  d.grid[s.id]=d.grid[s.id]||{};
  var cur=d.grid[s.id][key]||0;
  if(done>0&&open===0)d.grid[s.id][key]=2;
  else if(done>0)d.grid[s.id][key]=1;
  else if(cur===1||cur===2)delete d.grid[s.id][key];
}
function dayCycle(s,date){
  var cur=dgt(S.d,s,date),nv=cur===0?2:cur===2?3:0,y=+date.slice(0,4),m=+date.slice(5,7),before=yearDone(S.d,s,y),was=pct(s);
  op(function(d){
    d.days[s.id]=d.days[s.id]||{};
    if(nv)d.days[s.id][date]=nv;else delete d.days[s.id][date];
    monthSync(d,s,y,m);
    if(nv===2)bump(d,s.id);
    return d;
  });
  if(!before&&yearDone(S.d,s,y)){burst();say(y+"년 "+s.name+" 정리를 마쳤어요.")}
  else if(was<100&&pct(s)===100)say(s.name+" 정리를 모두 완료했어요.");
}
function dayBulk(s,y,m,mode){
  op(function(d){
    d.days[s.id]=d.days[s.id]||{};
    var dim=new Date(y,m,0).getDate(),td=today();
    for(var i=1;i<=dim;i++){var dt=y+"-"+pad(m)+"-"+pad(i);if(dt>td)break;
      if(mode==="all"){if(d.days[s.id][dt]!==3)d.days[s.id][dt]=2}else delete d.days[s.id][dt]}
    monthSync(d,s,y,m);
    if(mode==="all")bump(d,s.id);
    return d;
  });
}

  stage.appendChild(terrariumSvg(x,lv,g));
  var cap=el("div","terrarium-caption");
  cap.innerHTML="<span>현재 생태 단계 · <strong>"+TERRARIUM_STAGES[stageIdx]+"</strong></span><span>Lv."+lv+" · "+ttl(lv)+"</span>";
  stage.appendChild(cap);
  G.appendChild(stage);

  var lc=el("div","gcard");
  var t1=el("div","t1");
  t1.style.cssText="display:flex;justify-content:space-between;align-items:baseline;font-size:17px;font-weight:700;letter-spacing:-0.02em";
  t1.appendChild(el("span",null,"Lv."+lv+" · "+ttl(lv)));
  t1.appendChild(el("span",null,"다음 레벨까지 "+(100-x%100)+" XP"));
  lc.appendChild(t1);

  var bar=el("div","bar"),bi=el("i");
  bi.style.width=(x%100)+"%";bar.appendChild(bi);lc.appendChild(bar);

  var gs=el("div","gs4");
  [[x,"경험치"],[g.cells+g.items+g.removed,"정리 완료"],[streak(),"현재 연속"],[bestStreak(),"최고 연속"]].forEach(function(a){
    var c=el("div");c.appendChild(el("b",null,String(a[0])));c.appendChild(el("span",null,a[1]));gs.appendChild(c);
  });
  lc.appendChild(gs);
  G.appendChild(lc);

  var ec=el("div","gcard");
  ec.appendChild(el("h3",null,"생태 요소 성장"));
  var eGrid=el("div","env-grid");
  ENV_ITEMS.forEach(function(item){
    var ok=lv>=item.lv;
    var card=el("div","env-item"+(ok?"":" lock"));
    card.appendChild(el("div","ico",item.ico));
    card.appendChild(el("b",null,item.name));
    card.appendChild(el("span",null,ok?item.desc:"Lv."+item.lv+" 해금"));
    eGrid.appendChild(card);
  });
  ec.appendChild(eGrid);
  G.appendChild(ec);

  var ac=el("div","gcard");
  ac.appendChild(el("h3",null,"정리 마일스톤"));
  var ag=el("div","ag");
  ACH.forEach(function(a){
    var ok=a[4](g),c=el("div","ac"+(ok?" ok":" lock"));
    var e=el("div","ae",a[1]),w=el("div");
    w.appendChild(el("b",null,a[2]));
    w.appendChild(el("span",null,ok?"달성 완료":a[3]));
    c.appendChild(e);c.appendChild(w);ag.appendChild(c);
  });
  ac.appendChild(ag);
  G.appendChild(ac);
}

/* settings */
$("bCfg").onclick=function(){
  $("gu").value=CFG.user;$("gr").value=CFG.repo;$("gt").value=CFG.token;
  $("cfg").classList.toggle("show");
};
$("gshow").onclick=function(){var i=$("gt");i.type=i.type==="password"?"text":"password"};

function applyZoom(){
  var c=document.querySelector(".card");
  if(c)c.style.zoom=S.zoom;
  document.querySelectorAll("[data-z]").forEach(function(b){b.className="chip"+(+b.dataset.z===S.zoom?" on":"")});
}
document.querySelectorAll("[data-z]").forEach(function(b){
  b.onclick=function(){S.zoom=+b.dataset.z;save();applyZoom()};
});
applyZoom();

function applyFont(){
  var root=document.documentElement.style;
  root.setProperty("--body",S.font==="gowun"?"'Gowun Dodum','Noto Sans KR',sans-serif":S.font==="jua"?"'Noto Sans KR','Gowun Dodum',sans-serif":"'Inter','Noto Sans KR','Gowun Dodum',sans-serif");
  root.setProperty("--title",S.font==="jua"?"'Jua','Noto Sans KR',sans-serif":S.font==="gowun"?"'Gowun Dodum','Noto Sans KR',sans-serif":"'Inter','Noto Sans KR','Gowun Dodum',sans-serif");
  document.querySelectorAll("[data-f]").forEach(function(b){b.className="chip"+(b.dataset.f===S.font?" on":"")});
}
document.querySelectorAll("[data-f]").forEach(function(b){
  b.onclick=function(){S.font=b.dataset.f;save();applyFont()};
});
applyFont();

$("gtheme").onclick=function(){
  var dark=document.documentElement.getAttribute("data-theme")==="dark"||(!S.theme&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  S.theme=dark?"light":"dark";
  document.documentElement.setAttribute("data-theme",S.theme);
  save();
};
$("gsave").onclick=function(){
  CFG={user:cleanName($("gu").value),repo:cleanName($("gr").value),token:cleanTok($("gt").value)};
  $("gu").value=CFG.user;$("gr").value=CFG.repo;$("gt").value=CFG.token;
  saveCfg();
  if(!synced()){setDot("off");say("GitHub 아이디, 저장소, 토큰을 모두 입력해 주세요");return}
  op(function(d){return d});
  $("cfg").classList.remove("show");
};
$("gout").onclick=function(){
  CFG={user:"",repo:"",token:""};
  saveCfg();
  $("gu").value=$("gr").value=$("gt").value="";
  setDot("off");
  say("이 기기에서 GitHub 연결을 해제했습니다");
};

var lastDay=today();
function refreshDate(){NOW=new Date();CY=NOW.getFullYear();CM=NOW.getMonth()+1}
function tickDate(){var t=today();if(t!==lastDay){lastDay=t;refreshDate();render()}}
setInterval(tickDate,60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden){tickDate();pull()}});
render();
pull();
</script>
</body>
</html>
