:root[data-theme="dark"]{
  --page:#0b0c0e;--card:#121417;--ink:#f4f4f5;--sub:#b6b6c0;--muted:#9a9aa4;--field:#1b1e23;--line:rgba(255,255,255,.07);
  --accent:#2dd4bf;--soft:rgba(45,212,191,.11);--ring:rgba(45,212,191,.24);--item:#171a1e;--hover:#242932;
  --sm:0 1px 2px rgba(0,0,0,.35),0 8px 24px -8px rgba(0,0,0,.45);--shadow:0 16px 40px -14px rgba(0,0,0,.6),0 4px 12px -2px rgba(0,0,0,.35);--onacc:#0b1110;
  color-scheme:dark}

/* ===== 기본 ===== */
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}   /* 노션 배경이 그대로 보이게 */
body{padding:16px;display:flex;justify-content:center}
.card{width:100%;max-width:440px;padding:24px 24px 18px;background:var(--card);border-radius:28px;box-shadow:var(--shadow);word-break:keep-all;overflow-wrap:anywhere}
button{font-family:var(--body);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .16s cubic-bezier(.22,1,.36,1),background-color .2s,color .2s}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ===== 머리글 (앱과 같은 모양) ===== */
.head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.mark{width:40px;height:40px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:none}
.head-text{flex:1;min-width:0}
.head h1{font-size:19px;font-weight:700;line-height:1.25;letter-spacing:-.025em;margin:0}
.head-sub{font-size:13px;color:var(--muted);margin-top:2px}
.badge{background:var(--soft);color:var(--accent);font-weight:600;font-size:13px;min-width:38px;text-align:center;padding:6px 12px;border-radius:999px;flex:none;white-space:nowrap}
.badge:empty{display:none}

/* ===== 큰 숫자 · 진행 막대 ===== */
.big{font-size:clamp(42px,12vw,54px);font-weight:800;line-height:1;letter-spacing:-.045em;margin:2px 0 14px;display:flex;align-items:baseline;gap:4px}
.big small{font-size:.4em;font-weight:700;color:var(--accent);letter-spacing:0}
.bar{height:8px;border-radius:999px;background:var(--field);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:inherit;background:var(--accent);transition:width .6s ease}

/* ===== 작은 숫자 칸 ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-top:14px}
.stat{background:var(--field);border-radius:16px;padding:10px 13px 11px}
.stat span{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}
.stat b{display:block;font-size:18px;font-weight:700;letter-spacing:-.02em;margin-top:1px;white-space:nowrap}

/* ===== 푸터 (앱과 같은 모양) ===== */
.foot{display:flex;align-items:center;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.lab{flex:1;min-width:0;font-size:12px;letter-spacing:.08em;font-weight:600;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab i{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 3px var(--soft)}
.fb{width:36px;height:36px;border-radius:999px;border:0;background:var(--field);color:var(--sub);font-size:14px;display:grid;place-items:center;flex:none;padding:0}
.fb:hover{background:var(--hover);color:var(--ink)}

@media (max-width:380px){body{padding:10px}.card{padding:20px 16px 16px;border-radius:24px}.head{gap:12px;margin-bottom:14px}.stat b{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ───── 주간: 요일 줄은 앱의 탭과 같은 모양 ───── */
.days{list-style:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:5px;margin:14px 0 0;background:var(--field);border-radius:16px}
.days li{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;border-radius:12px;color:var(--sub)}
.days li span{font-size:12px;font-weight:600;color:var(--muted)}
.days li b{font-size:15px;font-weight:700;letter-spacing:-.02em}
.days li.past{opacity:.45}
.days li.today{background:var(--card);color:var(--ink);box-shadow:var(--sm)}
.days li.today span{color:var(--accent)}
@media (max-width:380px){.days{gap:2px;padding:4px}.days li b{font-size:14px}}
</style>
<script>
/* 위젯 공통 — 외부 의존성 없음
   주소 옵션: ?theme=dark | light | auto · ?utc=9 (시간대, 기본 한국 Asia/Seoul = +9, 서머타임 없음) · ?h24=1 (시계 24시간제)
   테마를 안 정하면 네 앱에서 고른 테마(⚙ 테마 전환)를 따라감 */
(function(){
  var q=new URLSearchParams(location.search);
  function store(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}   /* 노션 안에서 막혀도 괜찮게 */
  var th=q.get("theme")||(store("vault:ui")||{}).theme||"light";
  if(th==="auto")th=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  if(th==="dark")document.documentElement.setAttribute("data-theme","dark");
  var off=Number(q.get("utc"));if(q.get("utc")===null||q.get("utc")===""||!isFinite(off))off=9;
  var W={
    q:q,DAY:864e5,dow:"일월화수목금토",
    /* 지금 시각을 '그 시간대의 벽시계'로 — getUTC* 로 읽기 */
    now:function(){return new Date(Date.now()+off*36e5)},
    pad:function(n){return String(n).padStart(2,"0")},
    gmt:function(){return "GMT"+(off>=0?"+":"-")+Math.abs(off)},
    md:function(d){return (d.getUTCMonth()+1)+"월 "+d.getUTCDate()+"일"},
    hm:function(d){var h=d.getUTCHours();return (h<12?"오전":"오후")+" "+(h%12||12)+":"+W.pad(d.getUTCMinutes())},
    tick:function(fn,ms){fn();return setInterval(fn,ms||1000)},
    set:function(id,v){var e=document.getElementById(id);if(e&&e.textContent!==String(v))e.textContent=v},
    copy:function(text,btn){
      var old=btn&&btn.textContent;
      function done(){if(!btn)return;btn.textContent="✓";setTimeout(function(){btn.textContent=old},1200)}
      function fallback(){var t=document.createElement("textarea");t.value=text;t.setAttribute("readonly","");t.style.cssText="position:fixed;top:0;left:0;opacity:0";
        document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch(e){}t.remove();done()}
      /* 노션 안(iframe)에서는 클립보드 권한이 막힐 수 있어서 실패하면 예전 방식으로 */
      try{if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(done,fallback);else fallback()}catch(e){fallback()}
    }
  };
  window.W=W;
  document.addEventListener("DOMContentLoaded",function(){
    document.querySelectorAll("[data-copy-self]").forEach(function(b){
      b.title="이 위젯 주소 복사";
      b.addEventListener("click",function(){W.copy(location.origin+location.pathname,b)});
    });
  });
})();
</script>
</head>
<body>
<main class="card" aria-label="주간 진행률">
  <header class="head">
    <div class="mark" aria-hidden="true">📅</div>
    <div class="head-text"><h1>주간 진행률</h1><div class="head-sub" id="range"></div></div>
    <span class="badge" id="wk"></span>
  </header>
  <p class="big num"><span id="pct">0.0</span><small>%</small></p>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <ol class="days" id="days"></ol>
  <div class="stats">
    <div class="stat"><span>지난 날</span><b class="num" id="past">–</b></div>
    <div class="stat"><span>남은 날 (오늘 포함)</span><b class="num" id="left">–</b></div>
  </div>
  <footer class="foot">
    <span class="lab"><i></i><span id="stamp">실시간</span></span>
    <button class="fb" type="button" data-copy-self aria-label="이 위젯 주소 복사">🔗</button>
  </footer>
</main>
<script>
/* 한 주는 일요일 시작 */
var list=document.getElementById("days"),items=[];
for(var i=0;i<7;i++){var li=document.createElement("li");li.innerHTML="<span>"+W.dow[i]+"</span><b class=\"num\"></b>";list.appendChild(li);items.push(li)}
function render(){
  var d=W.now(),dow=d.getUTCDay(),dayStart=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()),weekStart=dayStart-dow*W.DAY;
  var pct=(d.getTime()-weekStart)/(7*W.DAY)*100;
  W.set("pct",pct.toFixed(1));
  document.getElementById("bar").style.width=pct+"%";
  W.set("past",dow+"일");W.set("left",(7-dow)+"일");
  items.forEach(function(li,i){
    li.querySelector("b").textContent=new Date(weekStart+i*W.DAY).getUTCDate();
    li.className=i<dow?"past":i===dow?"today":"";
    if(i===dow)li.setAttribute("aria-current","date");else li.removeAttribute("aria-current");
  });
  var a=new Date(weekStart),b=new Date(weekStart+6*W.DAY);
  W.set("range",W.md(a)+" – "+W.md(b));   /* 일요일 시작 */
  /* 몇째 주 (그해 1월 1일이 든 주 = 1주차, 일요일 시작) */
  var y0=Date.UTC(d.getUTCFullYear(),0,1),doy=Math.floor((dayStart-y0)/W.DAY)+1;
  W.set("wk",Math.ceil((doy+new Date(y0).getUTCDay())/7)+"주차");
  W.set("stamp","실시간 · "+W.md(d)+" "+W.hm(d));
}
W.tick(render,1000);
</script>
</body>
</html>
